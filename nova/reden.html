  };
  var BILDCHEN = { nova: 'nova-3d.jpg', tropfi: 'figuren/tropfi-klein.jpg', otti: '../otti/icon-180.png', kiki: '../kiki/icon-180.png', jackie: '../jackie/icon-180.png', 'mr. ping': '../tradeping/icon-180.png',
    sparky: 'figuren/sparky-klein.jpg', 'coin maker': 'figuren/coinmaker-klein.jpg', flo: 'figuren/flo-klein.jpg', fompa: 'figuren/fompa-klein.jpg', sunny: 'figuren/sunny-klein.jpg' };
  var KEY = (new URLSearchParams(location.search).get('f') || 'otti').toLowerCase();
  var F = FIGUREN[KEY] || FIGUREN.otti, NAME = F.name, AGENT = F.agent, RUHE = F.ruhe || 0;
  document.title = NAME;
  // Home-Bildschirm-Symbol: das Gesicht der Figur, die gerade spricht.
  if (KEY !== 'nova' && BILDCHEN[KEY]) document.getElementById('symbol').href = BILDCHEN[KEY];
  var $ = function (id) { return document.getElementById(id); };
  var buehne = $('buehne'), figur = $('figur');
  var knopf = $('knopf'), status = $('status'), text = $('text'), hinweis = $('hinweis');
  var conv = null, startet = false, sitzung = 0, eigene = [], mund = null, offen = RUHE, spitze = 0.15;
  // Alle Figuren in einer App: so teilen sie dasselbe Gedächtnis, und Nova sieht alles.
  Object.keys(BILDCHEN).forEach(function (k) {
    var a = document.createElement('a'); a.href = '?f=' + encodeURIComponent(k); a.setAttribute('aria-label', 'Mit ' + FIGUREN[k].name + ' reden');
    if (k === KEY) { a.className = 'an'; setTimeout(function () { a.scrollIntoView({ inline: 'center', block: 'nearest' }); }, 50); }
    var im = document.createElement('img'); im.src = BILDCHEN[k]; im.alt = ''; a.appendChild(im);
    a.addEventListener('click', function (e) { e.preventDefault(); if (conv) { var c = conv; ende(); c.endSession().catch(function () {}); } location.replace(a.href); });
    $('wahl').appendChild(a);
  });
  $('name').textContent = NAME; $('vname').textContent = NAME;
  // Bei Nova keine Figurenreihe: sonst landet man aus Versehen bei Otti und findet nicht zurück.
  if (KEY === 'nova') $('wahl').style.display = 'none';
  $('zurueck').addEventListener('click', function (e) { e.preventDefault(); if (history.length > 1) history.back(); else location.href = '../apps/'; });

  // Ottis Gesicht: Mund bewegt sich im Takt seiner Stimme (nova/mund.js).
  var bild = new Image();
  bild.onload = function () {
    try {
      mund = NovaMund(figur, bild, F.mund); mund.setze(RUHE);
    } catch (e) { figur.getContext('2d').drawImage(bild, 0, 0); }
  };
  bild.src = F.bild;

  // Funken, wenn Otti sich freut.
  function funken(n) {
    for (var i = 0; i < n; i++) {
      var f = document.createElement('div'); f.className = 'funke';
      var w = Math.random() * Math.PI * 2, r = 60 + Math.random() * 90;
      f.style.left = (35 + Math.random() * 30) + '%'; f.style.top = (40 + Math.random() * 25) + '%';
      f.style.setProperty('--dx', Math.cos(w) * r + 'px'); f.style.setProperty('--dy', Math.sin(w) * r - 40 + 'px');
      buehne.appendChild(f); setTimeout(function (e) { e.remove(); }.bind(null, f), 1100);
    }
  }
  function hopsen() {
    figur.classList.remove('hopsen'); void figur.offsetWidth; figur.classList.add('hopsen'); funken(10);
  }

  // Gedächtnis: worüber ihr geredet habt, nur auf diesem Handy gespeichert.
  var GED = KEY === 'otti' ? 'otti_gedaechtnis' : 'gedaechtnis_' + KEY, jetztGesagt = [];
  function gedaechtnis() { try { return JSON.parse(localStorage.getItem(GED)) || []; } catch (e) { return []; } }
  function merken() {
    if (jetztGesagt.length < 2) { jetztGesagt = []; return; }
    var t = jetztGesagt.join('\n'); var gross = KEY === 'nova' || KEY === 'tropfi'; var max = gross ? 2500 : 900; if (t.length > max) t = t.slice(-max);
    var g = gedaechtnis(); g.push({ d: new Date().toLocaleDateString('de-CH'), t: t });
    try { localStorage.setItem(GED, JSON.stringify(g.slice(gross ? -12 : -4))); } catch (e) {}
    if (lernenAn()) zuNova(t);
    jetztGesagt = []; vergessenZeigen();
  }
  // Nova lernt: mit Einwilligung geht jedes Gespräch als Erfahrung in die Sense Engine.
  // Adresse und Passwort sind die aus «Handy verbinden»; ohne Verbindung bleibt alles nur auf dem Handy.
  function hol(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function lernenAn() { try { return localStorage.getItem('nova_lernen') === '1'; } catch (e) { return false; } }
  function zuNova(text) {
    var a = String(hol('drlab-hermes-adresse') || '').trim().replace(/\/+$/, ''), k = hol('drlab-hermes-passwort');

  try {
    var mt = /[#&]topf=([^&]+)/.exec(location.hash);
    if (mt) { var tp = JSON.parse(decodeURIComponent(mt[1])); if (Array.isArray(tp)) localStorage.setItem('tp.topf', JSON.stringify(tp)); history.replaceState(null, '', location.pathname + location.search); }
  } catch (e) {}
  function positionen() {
    var it = []; try { it = JSON.parse(localStorage.getItem('tp.items')) || []; } catch (e) {}

    if (topf.length) {

      var t = topf.map(function (x) {
        var e = +x.einsatz || 50, w = x.kauf && x.jetzt ? e * x.jetzt / x.kauf : e;

      return 'Übungstopf in Yuh: ' + t + '. Ganzer Topf ' + summe.toFixed(2) + ' von ' + start + ' Franken.' + (it.length ? ' Weitere beobachtete Titel: ' + it.map(function (x) { return x.name || x.sym; }).join(', ') + '.' : '');
    }
    if (!it.length) return 'Noch nicht eingetragen. Frag Diego freundlich, welche vier Titel er gekauft hat.';
    return it.map(function (x) {
      var t = (x.name || x.sym) + (x.sym ? ' (' + x.sym + ')' : '');
      if (x.man != null) t += ', zuletzt von Hand eingetragen: ' + x.man + ' ' + (x.cur || '');
      if (x.under != null) t += ', Ping unter ' + x.under; if (x.over != null) t += ', Ping über ' + x.over;

  // Nova verbindet: sie bekommt, was die anderen Figuren auf diesem Handy erlebt haben.
  function welt() {
    var teile = [];
    ['tropfi', 'otti', 'kiki', 'jackie', 'mr. ping', 'sparky', 'coin maker', 'flo', 'fompa', 'sunny'].forEach(function (k) {
      var g = []; try { g = JSON.parse(localStorage.getItem(k === 'otti' ? 'otti_gedaechtnis' : 'gedaechtnis_' + k)) || []; } catch (e) {}
      g.slice(-2).forEach(function (x) { teile.push(FIGUREN[k].name + ' am ' + x.d + ':\n' + String(x.t).slice(-450)); });
    });
    var p = positionen(); if (p.indexOf('Noch nicht') !== 0) teile.push('Mr. Pings Titel: ' + p);
    if (serverWelt) teile.push('Aus der Sense Engine (andere Apps, KI-Verse):\n' + serverWelt);
    return teile.length ? teile.join('\n\n') : 'Noch nichts gespeichert.';
  }
  // Novas Rückweg: was andere Figuren, Apps und das KI-Verse ihr über die Sense Engine erzählt haben.
  // Nur mit «Handy verbinden»; antwortet der Server nicht schnell, startet das Gespräch ohne.
  var serverWelt = '';
  function serverHolen() {
    var a = String(hol('drlab-hermes-adresse') || '').trim().replace(/\/+$/, ''), k = hol('drlab-hermes-passwort');
    if (!a || !k || !window.fetch) return Promise.resolve();
    var ab = window.AbortController ? new AbortController() : null;
    var uhr = setTimeout(function () { if (ab) ab.abort(); }, 2500);
    return fetch(a + '/erfahrung', { headers: { 'Authorization': 'Bearer ' + k }, signal: ab ? ab.signal : undefined })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        var l = Array.isArray(d) ? d : null;
        if (!l && d && typeof d === 'object') for (var x in d) if (Array.isArray(d[x])) { l = d[x]; break; }
        // Puls und Stimme (HumanSpark) bleiben auf unserem Server und gehen nie an den Sprach-Agenten.
        if (l) l = l.filter(function (e) { return !/humanspark/i.test(String(e.app || '')) && String(e.frage || '').indexOf('[stimme-puls]') !== 0; });
        if (!l || !l.length) return;
        serverWelt = l.slice(-8).map(function (e) {
          var t = String(e.frage || e.text || '').slice(-350), an = String(e.antwort || '').slice(0, 200);
          return (e.app || 'Unbekannt') + (e.art ? ' (' + e.art + ')' : '') + ':\n' + t + (an ? '\nAntwort: ' + an : '');
        }).join('\n\n');
      })
      .catch(function () {})
      .then(function () { clearTimeout(uhr); });
  }
  function variablen() {
    var v = {};
    if (F.gedaechtnis) v.letztes_mal = erinnerung();
    if (F.positionen) v.positionen = positionen();
    if (F.welt) v.welt = welt();
    return Object.keys(v).length ? v : undefined;
  }

  function zeile(wer, t) {
    jetztGesagt.push((wer === 'du' ? 'Gegenüber: ' : NAME + ': ') + t);
    var d = document.createElement('div'); d.className = 'z ' + wer; d.textContent = t;
    text.appendChild(d); text.scrollTop = text.scrollHeight;
    while (text.children.length > 30) text.removeChild(text.firstChild);
  }

  // Nova malt sichtbar: zuerst stellt sie sich das Bild vor (weiche Farbtupfer, der Pinsel tanzt),
  // dann trägt der Pinsel das fertige Bild Strich für Strich auf die Leinwand auf.
  var leinwand = (function () {
    var cv = $('leinwand'), ctx = cv.getContext('2d'), maske = document.createElement('canvas'), mk = maske.getContext('2d');
    var lauf = 0, FARBEN = ['#f5c542', '#7fd4ff', '#ff9f80', '#9be37a', '#c9a2ff', '#16306b'];
    function groesse() { var r = cv.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1);
      cv.width = maske.width = Math.round(r.width * d) || 600; cv.height = maske.height = Math.round(r.height * d) || 600; }
    function pinsel(x, y, w) { // Pinselspitze mit Stiel
      ctx.save(); ctx.translate(x, y); ctx.rotate(-0.7);
      ctx.fillStyle = '#8a5a2b'; ctx.fillRect(-w * 0.09, -w * 1.25, w * 0.18, w * 0.95);
      ctx.fillStyle = '#c0c4cc'; ctx.fillRect(-w * 0.12, -w * 0.34, w * 0.24, w * 0.16);
      ctx.fillStyle = '#2a2016'; ctx.beginPath(); ctx.moveTo(-w * 0.12, -w * 0.18); ctx.quadraticCurveTo(0, w * 0.12, w * 0.12, -w * 0.18); ctx.fill();
      ctx.restore(); }
    function vorstellen() {
      var nr = ++lauf; groesse(); buehne.classList.add('malt'); buehne.classList.remove('zeigt');
      status.textContent = '🎨 ' + NAME + ' stellt es sich vor …';
      var W = cv.width, H = cv.height, t0 = performance.now(), tupfer = [];
      (function schritt(t) {
        if (nr !== lauf) return;
        var k = (t - t0) / 1000, x = W * (0.5 + 0.32 * Math.sin(k * 1.3) * Math.cos(k * 0.7)), y = H * (0.5 + 0.3 * Math.sin(k * 0.9 + 1));
        if (tupfer.length < 260 && Math.random() < 0.5) tupfer.push([x, y, (0.03 + Math.random() * 0.06) * W, FARBEN[tupfer.length % FARBEN.length]]);
        ctx.fillStyle = '#f6efe0'; ctx.fillRect(0, 0, W, H);
        tupfer.forEach(function (p) { ctx.globalAlpha = 0.28; ctx.fillStyle = p[3]; ctx.beginPath(); ctx.arc(p[0], p[1], p[2], 0, 7); ctx.fill(); });
        ctx.globalAlpha = 1; pinsel(x, y, W * 0.16);
        if (k > 4) status.textContent = '🎨 ' + NAME + ' malt …';
        requestAnimationFrame(schritt);
      })(t0);
    }
    function malen(img, fertig) {
      var nr = ++lauf; if (!buehne.classList.contains('malt')) { groesse(); buehne.classList.add('malt'); }
      status.textContent = '🎨 ' + NAME + ' malt …';
      var W = cv.width, H = cv.height, reihen = 7, dauer = 2600, t0 = performance.now(), breit = H / reihen * 1.5;
      mk.clearRect(0, 0, W, H); mk.lineCap = 'round'; mk.lineJoin = 'round'; mk.strokeStyle = '#000';
      var vorher = 0, px = 0, py = breit / 3;
      function punkt(f) { // Zickzack über die Leinwand, Reihe für Reihe, mit leichtem Wackeln
        var r = Math.min(reihen - 1, Math.floor(f * reihen)), g = f * reihen - r, hin = r % 2 === 0;
        var x = (hin ? g : 1 - g) * (W + breit) - breit / 2, y = (r + 0.5) * H / reihen + Math.sin(g * 9 + r) * breit * 0.12;
        return [x, y]; }
      (function schritt(t) {
        if (nr !== lauf) return;
        var f = Math.min(1, (t - t0) / dauer);
        for (var i = 1; i <= 6; i++) { var q = punkt(vorher + (f - vorher) * i / 6); mk.lineWidth = breit * (0.8 + Math.random() * 0.4);
          mk.beginPath(); mk.moveTo(px, py); mk.lineTo(q[0], q[1]); mk.stroke(); px = q[0]; py = q[1]; }
        vorher = f;
        ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#f6efe0'; ctx.fillRect(0, 0, W, H);
        var bild = document.createElement('canvas'); bild.width = W; bild.height = H; var bc = bild.getContext('2d');
        var s = Math.max(W / img.naturalWidth, H / img.naturalHeight), iw = img.naturalWidth * s, ih = img.naturalHeight * s;
        bc.drawImage(img, (W - iw) / 2, (H - ih) / 2, iw, ih); bc.globalCompositeOperation = 'destination-in'; bc.drawImage(maske, 0, 0);
        ctx.drawImage(bild, 0, 0); pinsel(px, py, W * 0.16);
        if (f < 1) requestAnimationFrame(schritt);
        else setTimeout(function () { if (nr !== lauf) return; buehne.classList.remove('malt'); fertig(); }, 350);
      })(t0);
    }
    function stopp() { lauf++; buehne.classList.remove('malt'); }
    return { vorstellen: vorstellen, malen: malen, stopp: stopp };
  })();

  // Novas Zeichnungen: das Bild erscheint im Gespräch, Tippen öffnet es gross.
  function bildZeigen(p) {
    var url = String(p && p.bild || '');
    if (!/^https:\/\//.test(url)) return;
    var d = document.createElement('div'); d.className = 'z otti bild';
    var a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener';
    var im = document.createElement('img'); im.src = url; im.alt = p.titel || 'Zeichnung von ' + NAME; im.style.display = 'none';
    // Malt Nova noch, gibt es das Bild erst nach 15–40 s: bis dahin alle 4 s nachschauen.
    var versuche = 0, warte = document.createElement('small'); warte.textContent = NAME + ' malt …';
    // Das fertige Bild erscheint gross auf der Bühne statt Nova; Tippen auf die Bühne zeigt Nova wieder.
    leinwand.vorstellen();
    im.onload = function () { if (warte.parentNode) warte.remove(); text.scrollTop = text.scrollHeight;
      leinwand.malen(im, function () { im.style.display = ''; text.scrollTop = text.scrollHeight; $('gemalt').src = im.src; $('gemalt').alt = im.alt; buehne.classList.add('zeigt'); status.textContent = '🎨 Fertig gemalt.'; }); };
    im.onerror = function () {
      if (++versuche > 40) { warte.textContent = 'Das Bild kam nicht an.'; leinwand.stopp(); return; }
      if (!warte.parentNode) d.insertBefore(warte, d.firstChild);
      setTimeout(function () { im.src = url + (url.indexOf('?') < 0 ? '?' : '&') + 'v=' + versuche; }, 2500);
    };
    a.appendChild(im); d.appendChild(a);
    if (p.titel) { var t = document.createElement('small'); t.textContent = p.titel; d.appendChild(t); }
    text.appendChild(d); text.scrollTop = text.scrollHeight; hopsen();
    maltSeit = 0;
    jetztGesagt.push(NAME + ': [Bild: ' + (p.titel || 'Zeichnung') + ']');
  }

  // Mund und Kopf folgen der Stimme; beim Zuhören neigt Otti den Kopf.
  var neigung = 0;
  function takt() {
    var ziel = RUHE, hoer = 0;
    if (conv) {
      var v = 0, iv = 0;
      try { v = conv.getOutputVolume() || 0; } catch (e) {}
      try { iv = conv.getInputVolume() || 0; } catch (e) {}
      spitze = Math.max(spitze * 0.997, v, 0.08);
      if (conv.__spricht) ziel = Math.min(1, Math.max(-1, RUHE + (v / spitze) * 1.25 - 0.12 + (RUHE < 0 ? -0.6 : 0)));
      else hoer = Math.min(1, iv * 4);
    }
    offen += (ziel - offen) * (ziel > offen ? 0.55 : 0.3);
    if (mund) mund.setze(offen);
    neigung += ((conv && !conv.__spricht ? 2 + hoer * 1.5 : 0) - neigung) * 0.08;
    var hoch = conv && conv.__spricht ? Math.max(0, offen - RUHE) * 4 : 0;
    figur.style.transform = 'scale(1.07) rotate(' + neigung.toFixed(2) + 'deg) translateY(' + (-hoch).toFixed(1) + 'px)';
    requestAnimationFrame(takt);
  }
  requestAnimationFrame(takt);

  function knopfZeigen() {
    var an = !!conv || startet;
    if (conv && conv.__text) an = false;
    knopf.classList.toggle('aktiv', an);
    knopf.textContent = an ? '■' : '🎙';
    knopf.setAttribute('aria-label', an ? 'Gespräch beenden' : 'Gespräch starten');
  }

  // Schreiben kostet fast nichts: ohne Mikrofon, ohne Stimme, gleiches Wissen und gleicher Server-Zugang.
  async function starten(nurText) {
    if (startet || conv) return;
    startet = true; knopfZeigen();
    var nr = ++sitzung;
    status.textContent = NAME + ' wacht auf …'; hinweis.textContent = '';
    if (!nurText) try {
      await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      startet = false; knopfZeigen();
      status.textContent = 'Ich brauche das Mikrofon.';
      hinweis.textContent = 'Einstellungen › Safari › Mikrofon erlauben, dann nochmal tippen.';
      return;
    }
    if (F.welt) await serverHolen();
    try {
      var c = await ElevenLabsClient.Conversation.startSession({
        agentId: AGENT,
        connectionType: 'websocket',
        textOnly: !!nurText,
        clientTools: { zeige_bild: function (p) { bildZeigen(p); return 'gezeigt'; }, bewegen: bewegen, knoepfe: knoepfe },
        dynamicVariables: variablen(),
        onConnect: function () { status.textContent = NAME + (nurText ? ' liest mit.' : ' hört zu.'); hopsen(); },
        onDisconnect: function () { if (nr === sitzung && maltSeit) { maltSeit = 0; ende('Verbindung weg, das Bild kam nicht an. Nochmal 🎨'); return; } if (nr === sitzung) ende(nurText ? 'Schreib einfach weiter, ich bin gleich wieder da.' : 'Bis bald! Tipp auf den Knopf, dann bin ich wieder da.'); },
        onError: function (m) { hinweis.textContent = 'Fehler: ' + (m || 'unbekannt'); },
        onMessage: function (m) {
          if (m && m.source === 'user' && eigene.indexOf(m.message) >= 0) { eigene.splice(eigene.indexOf(m.message), 1); return; }
          if (m && m.source === 'user') $('chips').innerHTML = '';
          if (m && m.message) zeile(m.source === 'user' ? 'du' : 'otti', m.message); },
        onModeChange: function (m) {
          var sp = m && m.mode === 'speaking';
          if (conv) conv.__spricht = sp;
          buehne.classList.toggle('spricht', sp); buehne.classList.toggle('hoert', !sp);
          status.textContent = NAME + (sp ? ' spricht …' : ' hört zu.');
        }
      });
      c.__text = !!nurText;
      conv = c; startet = false; knopfZeigen();
      if (!nurText) buehne.classList.add('hoert');
    } catch (e) {
      startet = false; knopfZeigen();
      status.textContent = NAME + ' schläft gerade.';
      hinweis.textContent = 'Keine Verbindung. Internet prüfen und nochmal tippen.';
    }
  }

  function ende(t) {
    if (conv) merken();
    conv = null; startet = false;
    buehne.classList.remove('hoert', 'spricht');
    knopfZeigen();
    if (t) status.textContent = t;
  }

  // Nova bewegt sich, wenn sie es will (Agent-Werkzeug «bewegen»), und bietet Antworten zum Antippen an («knoepfe»).
  var BEWEGUNGEN = ['winken', 'huepfen', 'drehen', 'staunen', 'nicken', 'kopfschuetteln'];
  function bewegen(p) {
    var art = String((p && p.art) || '').toLowerCase();
    if (art === 'funkeln') { funken(24); return 'ok'; }
    if (BEWEGUNGEN.indexOf(art) < 0) { hopsen(); return 'ok'; }
    BEWEGUNGEN.forEach(function (b) { buehne.classList.remove(b); });
    void buehne.offsetWidth; buehne.classList.add(art);
    if (art === 'huepfen' || art === 'staunen') funken(art === 'staunen' ? 8 : 14);
    buehne.addEventListener('animationend', function weg(e) {
      if (e.target !== buehne) return; buehne.classList.remove(art); buehne.removeEventListener('animationend', weg); });
    return 'ok';
  }
  function knoepfe(p) {
    var liste = (p && p.optionen) || [];
    if (typeof liste === 'string') { try { liste = JSON.parse(liste); } catch (e) { liste = liste.split(/[|,\n]/); } }
    var box = $('chips'); box.innerHTML = '';
    liste.map(function (t) { return String(t).trim(); }).filter(Boolean).slice(0, 3).forEach(function (t) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = t;
      b.addEventListener('click', function () {
        box.innerHTML = '';
        if (conv && !conv.__text) { zeile('du', t); eigene.push(t); try { conv.sendUserMessage(t); } catch (err) {} }
        else senden(t);
      });
      box.appendChild(b);
    });
    return 'gezeigt';
  }

  async function senden(t) {
    $('chips').innerHTML = '';
    zeile('du', t); eigene.push(t);
    if (!conv) await starten(true);
    if (!conv) { hinweis.textContent = 'Nicht gesendet. Internet prüfen und nochmal.'; return; }
    try { conv.sendUserMessage(t); } catch (err) { hinweis.textContent = 'Nicht gesendet. Nochmal versuchen.'; }
  }
  $('schreiben').addEventListener('submit', function (e) {
    e.preventDefault();
    var feld = $('eingabe'), t = feld.value.trim();
    if (!t) return;
    feld.value = ''; senden(t);
  });
  // 🎨: Nova zeichnet, was im Feld steht, sonst das, worüber ihr gerade redet.
  // Mehrfach tippen schickt sonst mehrere Aufträge: bis das Bild da ist (max. 40 s) zählt nur der erste.
  var maltSeit = 0;
  $('malen').addEventListener('click', function () {
    if (Date.now() - maltSeit < 40000) { status.textContent = '🎨 ' + NAME + ' malt schon …'; return; }
    maltSeit = Date.now(); status.textContent = '🎨 ' + NAME + ' malt … App offen lassen.';
    var feld = $('eingabe'), t = feld.value.trim(); feld.value = '';
    var bitte = t ? 'Zeichne mir bitte: ' + t : 'Zeichne mir bitte, worüber wir gerade reden.';
    if (conv && !conv.__text) { zeile('du', bitte); eigene.push(bitte); try { conv.sendUserMessage(bitte); } catch (err) {} }
    else senden(bitte);
  });

  // Wie eine Store-App: beim Öffnen holt sich die App still die neueste Fassung, nie mitten im Gespräch.
  var stand = (document.querySelector('meta[name=stand]') || {}).content;
  function frisch() {
    if (document.hidden || conv || startet || !stand) return;
    fetch(location.pathname + '?s=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (h) {
      var m = h.match(/<meta name="stand" content="([^"]+)"/);
      if (!m || m[1] === stand || conv || startet) return;
      try { if (sessionStorage.getItem('stand.neu') === m[1]) return; sessionStorage.setItem('stand.neu', m[1]); } catch (e) {}
      var u = new URL(location.href); u.searchParams.set('v', m[1]); location.replace(u.toString());
    }).catch(function () {});
  }
  document.addEventListener('visibilitychange', frisch);
  window.addEventListener('pageshow', frisch);

  knopf.addEventListener('click', function () {
    // Vom Schreiben zur Stimme: Text-Gespräch schliessen, dann mit Mikrofon neu starten.
    if (conv && conv.__text) { var t = conv; ende(); t.endSession().catch(function () {}); starten(false); return; }
    if (conv) { var c = conv; ende('Bis bald!'); c.endSession().catch(function () {}); }
    else starten();
  });
  // Auf Otti tippen: er hüpft vor Freude.
  buehne.addEventListener('click', function () { if (buehne.classList.contains('zeigt')) buehne.classList.remove('zeigt'); else hopsen(); });

})();
</script>

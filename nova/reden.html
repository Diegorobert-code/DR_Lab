    if (!window.navigator.standalone && /iPhone|iPad/.test(navigator.userAgent)) { hinweis.textContent = 'Auf dem iPhone geht das nur aus der Nova-App vom Home-Bildschirm.'; return; }
    g.disabled = true;
    try {
      var reg = await navigator.serviceWorker.register('sw.js');
      if (await Notification.requestPermission() !== 'granted') throw new Error('nicht erlaubt');
      var k = await fetch(sv.basis + '/api/push/schluessel').then(function (r) { if (!r.ok) throw new Error('Server'); return r.json(); });
      var abo = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: schluessel(k.publicKey || k.schluessel) });
      var r = await fetch(sv.basis + '/api/push/abo?l=' + encodeURIComponent(sv.l), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(abo) });
      if (!r.ok) throw new Error('Server');
      try { localStorage.setItem('nova.push', '1'); } catch (e) {}
      g.textContent = '🔔 Nova darf schreiben'; hinweis.textContent = 'Fertig. Nova kann dir jetzt Mitteilungen mit ihrem Gesicht schicken.';
    } catch (e) {
      g.disabled = false;
      hinweis.textContent = /erlaubt/.test(e.message) ? 'Mitteilungen sind aus. Einstellungen › Mitteilungen › Nova erlauben.' : 'Der Server-Teil ist noch nicht bereit. Ich sag dir, wenn es geht.';
    }
  }
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', function (e) { if (e.data && e.data.sag) { SAG = e.data.sag; sagNova(); } });
    if (KEY === 'nova' && !BUEHNE.an && 'PushManager' in window) {
      $('glocke').hidden = false; $('glocke').addEventListener('click', glockeAn);
      try { if (localStorage.getItem('nova.push')) $('glocke').textContent = '🔔 Nova darf schreiben'; } catch (e) {}
    }
  }
  if (SAG && KEY === 'nova') status.textContent = 'Tipp auf mich, ich hab dir was zu sagen.';
  if (KEY === 'nova' && !BUEHNE.an) { $('hoeren').hidden = false; $('hoeren').addEventListener('click', function () { hoerSetzen(!HOER.an); }); }
  // Auf Otti tippen: er hüpft vor Freude.
  buehne.addEventListener('click', function () { if (buehne.classList.contains('zeigt')) buehne.classList.remove('zeigt'); else hopsen(); });

})();
</script>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova Zentrale</title>
<meta name="theme-color" content="#0b1a3a">
<link rel="apple-touch-icon" href="icon-nova-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { --nacht:#0b1a3a; --nacht2:#16306b; --gold:#f5c542; --text:#f4f1e8; --leise:#b9c3e0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { background:radial-gradient(120% 80% at 50% 0%, var(--nacht2), var(--nacht) 70%); color:var(--text);
    font:16px/1.4 system-ui, -apple-system, sans-serif; overflow:hidden; }
  .seiten { display:flex; height:100%; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; overscroll-behavior-x:contain; }
  .seiten::-webkit-scrollbar { display:none; }
  .seite { flex:none; width:100%; height:100%; scroll-snap-align:start; position:relative; }
  .start { display:flex; flex-direction:column; align-items:center; overflow-y:auto;
    padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 90px); }
  h1 { margin:0 0 6px; font-size:20px; color:var(--gold); letter-spacing:.5px; }
  .tipp { color:var(--leise); font-size:14px; margin:0 0 6px; }
  .liste { width:100%; max-width:480px; display:flex; flex-direction:column; gap:8px; }
  .gruppe { font-size:13px; letter-spacing:1px; text-transform:uppercase; color:var(--leise); margin:12px 2px 0; }
  .karte { display:flex; align-items:center; gap:12px; padding:14px; border-radius:16px; background:#ffffff10; color:inherit; text-decoration:none; }
  .karte.wichtig { background:#f5c54222; box-shadow:inset 0 0 0 2px var(--gold); }
  .karte .zeichen { font-size:26px; flex:none; }
  .karte .titel { font-weight:600; flex:1; }
  .karte .neu { font-size:12px; color:#1b1300; background:var(--gold); border-radius:20px; padding:2px 8px; flex:none; }
  .leer { color:var(--leise); text-align:center; margin-top:18px; }
  .kis { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:480px; margin-top:6px; }
  .kis button { border:0; background:none; padding:0; width:52px; text-align:center; color:var(--leise); font-size:11px; }
  .kis img { width:52px; height:52px; border-radius:50%; object-fit:cover; box-shadow:0 0 0 2px #ffffff22; display:block; margin-bottom:2px; }
  iframe { border:0; width:100%; height:100%; display:block; background:transparent; }
  .platz { position:absolute; inset:0; display:grid; place-items:center; color:var(--leise); }
  .musik { position:fixed; left:12px; right:12px; bottom:calc(env(safe-area-inset-bottom) + 20px); max-width:480px; margin:0 auto;
    display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:30px; background:#0b1a3ae6; box-shadow:0 0 0 1px #ffffff22, 0 10px 30px #0008; z-index:5; }
  .musik button { border:0; border-radius:50%; width:40px; height:40px; background:var(--gold); color:#1b1300; font-size:18px; flex:none; }
  .musik select { flex:1; min-width:0; background:transparent; color:var(--text); border:0; font:inherit; }
  .musik input[type=range] { width:70px; flex:none; accent-color:var(--gold); }
  .musik.zu { left:auto; right:12px; width:auto; padding:6px; }
  .musik.zu > :not(#musikAuf) { display:none; }
  #musikAuf { background:#ffffff18; color:var(--gold); }
  .punkte { position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 4px); display:flex; justify-content:center; gap:6px; pointer-events:none; z-index:6; }
  .punkte i { width:6px; height:6px; border-radius:50%; background:#ffffff40; }
  .punkte i.an { background:var(--gold); }
  /* ⤓ oben rechts: Threads und Designvorschläge als PDF oder Word, Videos zum Speichern. */
  .runter { position:fixed; top:calc(env(safe-area-inset-top) + 10px); right:12px; z-index:7; width:44px; height:44px; border:0; border-radius:50%;
    background:#ffffff18; color:var(--gold); font-size:22px; }
  .blatt { display:none; position:fixed; inset:0; z-index:9; background:#0008; align-items:flex-end; justify-content:center; }
  .blatt.an { display:flex; }
  .blatt .innen { width:100%; max-width:480px; background:var(--nacht); border-radius:22px 22px 0 0; padding:16px 16px calc(env(safe-area-inset-bottom) + 20px);
    display:flex; flex-direction:column; gap:8px; box-shadow:0 -10px 40px #0009; max-height:80%; overflow-y:auto; }
  .blatt b { color:var(--gold); font-size:18px; margin-bottom:4px; }
  .blatt button, .blatt a { display:block; text-align:left; border:0; border-radius:14px; padding:14px; background:#ffffff10; color:var(--text); font:inherit; text-decoration:none; }
  .blatt .klein { color:var(--leise); font-size:13px; margin-top:6px; }
  /* Drei App-Designs vorne, Threads aufklappbar mit letzter Zusammenfassung und To-dos. */
  .designs { width:100%; max-width:480px; display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin:10px 0 2px; }
  .designs:empty { display:none; }
  .designs figure { margin:0; border-radius:14px; overflow:hidden; background:#ffffff10; }
  .designs img { width:100%; aspect-ratio:3/4; object-fit:cover; display:block; }
  .designs figcaption { font-size:11px; color:var(--leise); padding:4px 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  details.karte { display:block; padding:0; }
  details.karte summary { display:flex; align-items:center; gap:12px; padding:14px; list-style:none; cursor:pointer; }
  details.karte summary::-webkit-details-marker { display:none; }
  details.karte .mehr { padding:0 14px 14px 52px; color:var(--leise); font-size:14px; }
  details.karte .mehr ul { margin:6px 0; padding-left:0; list-style:none; }
  details.karte .mehr li.erledigt { text-decoration:line-through; opacity:.6; }
  details.karte .mehr li .n { color:var(--gold); font-size:12px; margin-left:4px; }
  details.karte .mehr a { color:var(--gold); }
  #druck { display:none; }
  @media print {
    body { background:#fff; color:#000; overflow:visible; height:auto; }
    body > *:not(#druck) { display:none !important; }
    #druck { display:block; font:12pt/1.45 system-ui, -apple-system, sans-serif; }
    #druck h1 { font-size:20pt; margin:0 0 4pt; } #druck .stand { color:#555; margin-bottom:12pt; }
    #druck li { margin:0 0 6pt; } #druck img { max-width:100%; max-height:60vh; display:block; margin:6pt 0 14pt; page-break-inside:avoid; }
  }
</style>
</head>
<body>
<div class="seiten" id="seiten">
  <section class="seite start">
    <h1>Nova Zentrale</h1>
    <p class="tipp">Wisch nach links: jede KI hört dich sofort.</p>
    <div class="kis" id="kis"></div>
    <div class="designs" id="designs"></div>
    <div class="liste" id="liste"><div class="leer">Threads werden geladen …</div></div>
  </section>
</div>
<div class="musik zu" id="musik">
  <button id="musikAuf" aria-label="Musik">🎵</button>
  <button id="spiel" aria-label="Abspielen">▶</button>
  <select id="sender" aria-label="Musik wählen"></select>
  <input type="range" id="laut" min="0" max="1" step="0.05" value="0.5" aria-label="Lautstärke">
  <input type="file" id="eigene" accept="audio/*" multiple hidden>
</div>
<audio id="ton" preload="none" playsinline></audio>
<div class="punkte" id="punkte"></div>
<button class="runter" id="runter" aria-label="Herunterladen">⤓</button>
<div class="blatt" id="blatt"><div class="innen" id="blattInnen"></div></div>
<div id="druck"></div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  // Seite 1 = Threads und Links, danach wischen zu jeder KI. Jede KI läuft in ihrer eigenen reden.html (gleiche Stimme, gleiches Gedächtnis).
  var KIS = [
    ['lumo', 'Lumo', 'figuren/lumo-klein.jpg'], ['nova', 'Nova', 'nova-3d.jpg'], ['sparky', 'Sparky', 'figuren/sparky-klein.jpg'], ['mr. ping', 'Mr. Ping', '../tradeping/icon-180.png'],
    ['sunny', 'Sunny', 'figuren/sunny-klein.jpg'], ['fompa', 'Fompa', 'figuren/fompa-klein.jpg'], ['coin maker', 'Coin Maker', 'figuren/coinmaker-klein.jpg'],
    ['jackie', 'Jackie', '../jackie/icon-180.png'], ['flo', 'Flo', 'figuren/flo-klein.jpg'], ['kiki', 'Kiki', '../kiki/icon-180.png'],
    ['otti', 'Otti', '../otti/icon-180.png'], ['tropfi', 'Tropfi', 'figuren/tropfi-klein.jpg'], ['carmencita', 'Carmencita', 'figuren/carmencita-klein.jpg'],
    ['ava', 'Ava', 'figuren/ava-klein.jpg'], ['mama affe', 'Mama Affe', 'figuren/mamaaffe-klein.jpg'], ['granny', 'Granny', 'figuren/granny-klein.jpg']
  ];
  var seiten = $('seiten'), punkte = $('punkte'), rahmen = [];
  KIS.forEach(function (k, i) {
    var s = document.createElement('section'); s.className = 'seite';
    var p = document.createElement('div'); p.className = 'platz'; p.textContent = k[1] + ' …'; s.appendChild(p);
    seiten.appendChild(s); rahmen.push({ seite: s, f: k[0], fenster: null });
    var b = document.createElement('button'); b.innerHTML = '<img alt=""><span></span>';
    b.querySelector('img').src = k[2]; b.querySelector('span').textContent = k[1];
    b.addEventListener('click', function () { seiten.scrollTo({ left: (i + 1) * seiten.clientWidth, behavior: 'smooth' }); });
    $('kis').appendChild(b);
  });
  for (var i = 0; i <= KIS.length; i++) punkte.appendChild(document.createElement('i'));

  // Nur die KI vorne ist geladen und hört zu; weggewischte legen auf, damit nie zwei gleichzeitig reden (und Minuten kosten).
  var vorne = -1;
  function senden(r, typ) { try { r.fenster.contentWindow.postMessage({ zentrale: true, typ: typ }, location.origin); } catch (e) {} }
  function wechsel() {
    var n = Math.round(seiten.scrollLeft / seiten.clientWidth);
    [].forEach.call(punkte.children, function (x, j) { x.classList.toggle('an', j === n); });
    if (n === vorne) return;
    rahmen.forEach(function (r, j) {
      if (j === n - 1) {
        if (!r.fenster) {
          r.fenster = document.createElement('iframe');
          r.fenster.allow = 'microphone; autoplay; camera; fullscreen';
          r.fenster.src = 'reden.html?f=' + encodeURIComponent(r.f) + '&zentrale=1';
          r.fenster.onload = function () { if (rahmen[vorne - 1] === r) senden(r, 'start'); };
          r.seite.appendChild(r.fenster);
        } else senden(r, 'start');
      } else if (r.fenster) {
        senden(r, 'stopp');
        // Weit weg gewischt: ganz schliessen, das spart Speicher am Handy.
        if (Math.abs(j - (n - 1)) > 1) { var alt = r.fenster; r.fenster = null; setTimeout(function () { alt.remove(); }, 800); }
      }
    });
    vorne = n; var rt = document.getElementById("runter"); if (rt) rt.style.display = n === 0 ? "" : "none";
    try { sessionStorage.setItem('zentrale.seite', n); } catch (e) {}
  }
  var uhr = 0;
  seiten.addEventListener('scroll', function () { clearTimeout(uhr); uhr = setTimeout(wechsel, 180); });
  try { var alt = +sessionStorage.getItem('zentrale.seite') || 0; if (alt) setTimeout(function () { seiten.scrollLeft = alt * seiten.clientWidth; wechsel(); }, 60); } catch (e) {}
  wechsel();

  // Musik läuft in der Zentrale selbst weiter, auch beim Wischen. Spricht eine KI, wird sie leiser.
  var ton = $('ton'), laut = $('laut'), sender = $('sender'), musik = $('musik'), spricht = false;
  var SENDER = [
    ['Ruhig (Lounge)', 'https://ice1.somafm.com/groovesalad-128-mp3'],
    ['Weich (Vocals)', 'https://ice1.somafm.com/lush-128-mp3'],
    ['Fokus (Ambient)', 'https://ice1.somafm.com/dronezone-128-mp3'],
    ['Beats', 'https://ice1.somafm.com/beatblender-128-mp3'],
    ['Eigene Musik vom iPhone …', 'eigene']
  ];
  SENDER.forEach(function (x, i) { var o = document.createElement('option'); o.value = i; o.textContent = x[0]; sender.appendChild(o); });
  try { sender.value = localStorage.getItem('zentrale.sender') || 0; laut.value = localStorage.getItem('zentrale.laut') || 0.5; } catch (e) {}
  var eigene = [], eigenNr = 0;
  function lautstaerke() { ton.volume = laut.value * (spricht ? 0.35 : 1); }
  function spielen() {
    var x = SENDER[sender.value];
    if (x[1] === 'eigene') { if (!eigene.length) { $('eigene').click(); return; } ton.src = URL.createObjectURL(eigene[eigenNr % eigene.length]); }
    else ton.src = x[1];
    lautstaerke(); ton.play().then(function () { $('spiel').textContent = '❚❚'; }).catch(function () { $('spiel').textContent = '▶'; });
  }
  $('spiel').addEventListener('click', function () { if (ton.paused || !ton.src) spielen(); else { ton.pause(); $('spiel').textContent = '▶'; } });
  sender.addEventListener('change', function () { try { localStorage.setItem('zentrale.sender', sender.value); } catch (e) {} if (!ton.paused) spielen(); });
  laut.addEventListener('input', function () { lautstaerke(); try { localStorage.setItem('zentrale.laut', laut.value); } catch (e) {} });
  $('eigene').addEventListener('change', function () { eigene = [].slice.call(this.files || []); eigenNr = 0; if (eigene.length) spielen(); });
  ton.addEventListener('ended', function () { if (SENDER[sender.value][1] === 'eigene' && eigene.length) { eigenNr++; spielen(); } });
  $('musikAuf').addEventListener('click', function () { musik.classList.toggle('zu'); });
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin || !e.data || !e.data.zentrale) return;
    if (e.data.typ === 'spricht') { spricht = !!e.data.ja; lautstaerke(); }
    if (e.data.typ === 'wisch') {
      var vor = vorne;
      setTimeout(function () { if (vorne === vor) seiten.scrollTo({ left: Math.max(0, Math.min(KIS.length, vor + e.data.richtung)) * seiten.clientWidth, behavior: 'smooth' }); }, 300);
    }
  });

  // Threads und Links kommen als JSON vom Server (Adresse einmal mit #liste=… öffnen, dann gemerkt):
  // {threads:[{titel, wichtig, status, neu, bilder, link}], links:[{titel, url, video}]}
  var liste = $('liste');
  var m = location.hash.match(/liste=([^&]+)/), quelle = m ? decodeURIComponent(m[1]) : '';
  try { if (quelle) { localStorage.setItem('zentrale.quelle', quelle); history.replaceState(null, '', location.pathname + location.search); } else quelle = localStorage.getItem('zentrale.quelle') || ''; } catch (e) {}
  function karte(t, zeichen) {
    // Mit Zusammenfassung oder To-dos (vom Server): aufklappbar, sonst wie bisher ein direkter Link.
    var todos = t.todos || [];
    if (t.zusammenfassung || todos.length) {
      var d = document.createElement('details'); d.className = 'karte' + (t.wichtig ? ' wichtig' : '');
      var su = document.createElement('summary');
      var z0 = document.createElement('span'); z0.className = 'zeichen'; z0.textContent = zeichen;
      var t0 = document.createElement('span'); t0.className = 'titel'; t0.textContent = t.titel || '';
      su.append(z0, t0);
      var offen = todos.filter(function (x) { return !x.erledigt; }).length;
      if (t.neu) { var n0 = document.createElement('span'); n0.className = 'neu'; n0.textContent = t.status === 'wartet auf Diego' ? 'Wartet auf dich' : 'Änderung, wichtig'; su.appendChild(n0); }
      else if (offen) { var o0 = document.createElement('span'); o0.className = 'neu'; o0.textContent = offen + ' offen'; su.appendChild(o0); }
      var m = document.createElement('div'); m.className = 'mehr';
      if (t.zusammenfassung) { var p0 = document.createElement('div'); p0.textContent = t.zusammenfassung; m.appendChild(p0); }
      if (todos.length) {
        var ul = document.createElement('ul');
        todos.slice().sort(function (a, b) { return (a.erledigt ? 1 : 0) - (b.erledigt ? 1 : 0); }).forEach(function (x) {
          var li = document.createElement('li'); li.textContent = (x.erledigt ? '✓ ' : '○ ') + (x.text || '');
          if (x.erledigt) li.className = 'erledigt';
          if (x.neu && !x.erledigt) { var s0 = document.createElement('span'); s0.className = 'n'; s0.textContent = 'neu'; li.appendChild(s0); }
          ul.appendChild(li);
        });
        m.appendChild(ul);
      }
      if (t.link) { var l0 = document.createElement('a'); l0.href = t.link; l0.target = '_blank'; l0.rel = 'noopener'; l0.textContent = 'Öffnen ↗'; m.appendChild(l0); }
      d.append(su, m); return d;
    }
    var a = document.createElement(t.link || t.url ? 'a' : 'div'); a.className = 'karte' + (t.wichtig ? ' wichtig' : '');
    if (t.link || t.url) { a.href = t.link || t.url; a.target = '_blank'; a.rel = 'noopener'; }
    var z = document.createElement('span'); z.className = 'zeichen'; z.textContent = zeichen;
    var ti = document.createElement('span'); ti.className = 'titel'; ti.textContent = t.titel || '';
    a.append(z, ti);
    if (t.neu) { var n = document.createElement('span'); n.className = 'neu'; n.textContent = t.status === 'wartet auf Diego' ? 'Wartet auf dich' : 'Änderung, wichtig'; a.appendChild(n); }
    return a;
  }
  function gruppe(name, l, zeichen) {
    if (!l.length) return;
    var h = document.createElement('div'); h.className = 'gruppe'; h.textContent = name; liste.appendChild(h);
    l.forEach(function (t) { liste.appendChild(karte(t, zeichen(t))); });
  }
  // Feste Links (immer da), dazu was der Server unter links mitschickt.
  var FESTE_LINKS = [
    { titel: 'Tagesbericht', url: 'https://claude.ai/artifact/7kNwYbkM4ZF336obwX4s2S' },
    { titel: 'Alle Apps (Startseite)', url: 'https://claude.ai/artifact/HsqbPExpryB5TFp2btspc5' },
    { titel: 'Apps-Übersicht', url: 'https://diegorobert-code.github.io/DR_Lab/apps/' },
    { titel: 'Lernvideos', url: 'https://claude.ai/artifact/FRnkBqVzeGXL8kNV31ZRHH', video: true },
    { titel: 'Aktienschule', url: 'https://claude.ai/artifact/1j6T3pdWL1GN5RTCbmywaU' },
    { titel: 'Sunny rauchfrei', url: 'https://claude.ai/artifact/GmTSyEUNKXdHYgSRg5cnP6' },
    { titel: 'Fias Nest', url: 'https://diegorobert-code.github.io/DR_Lab/schlaf/' },
    { titel: 'Mondschein', url: 'https://diegorobert-code.github.io/DR_Lab/mondschein/' },
    { titel: 'Wäf Wäf', url: 'https://claude.ai/artifact/S2Z75Vs1HSdyZfveKvxyd4' },
    { titel: 'Zahnböcklein', url: 'https://claude.ai/artifact/8vTVapNioDzqS6nu2hwDMm' }
  ];
  function zeigen(d, hinweis) {
    // Server-Format (KI-Verse /api/zentrale/threads): status «läuft» | «wartet auf Diego» | «fertig».
    var l = ((d && d.threads) || []).filter(function (t) { return t.status !== 'fertig'; }).map(function (t) {
      return t.status === 'wartet auf Diego' ? Object.assign({}, t, { neu: true }) : t;
    }), links = ((d && d.links) || []).slice(), da = {};
    links.forEach(function (x) { da[x.url] = 1; });
    FESTE_LINKS.forEach(function (x) { if (!da[x.url]) links.push(x); });
    liste.innerHTML = '';
    if (hinweis || !l.length) { var h = document.createElement('div'); h.className = 'leer'; h.textContent = hinweis || 'Alles ruhig.'; liste.appendChild(h); }
    var rang = function (t) { return (t.neu ? 2 : 0) + (t.wichtig ? 1 : 0); };
    l.sort(function (a, b) { return rang(b) - rang(a); });
    gruppe('Wichtig', l.filter(function (t) { return rang(t) > 0; }), function (t) { return t.bilder ? '🖼' : '❗'; });
    gruppe('Hat noch Zeit', l.filter(function (t) { return !rang(t); }), function (t) { return t.bilder ? '🖼' : '🕊'; });
    gruppe('Links und Videos', links, function (t) { return t.video ? '🎬' : '🔗'; });
  }
  // ⤓ Herunterladen: PDF über «Drucken › Sichern» (iPhone: Teilen-Blatt), Word als .doc-Datei, Videos zum Öffnen und Sichern.
  var letzte = null, designs = null;
  function designQuelle() { return quelle ? quelle.replace('threads-lesen', 'designs-lesen').replace('/zentrale/threads', '/zentrale/designs') : ''; }
  function designsHolen() {
    var q = designQuelle(); if (!q) return Promise.resolve([]);
    return fetch(q + (q.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : {}; })
      .then(function (d) { designs = (d.designs || []).slice(0, 5); return designs; }).catch(function () { return []; });
  }
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function heute() { return new Date().toLocaleDateString('de-CH'); }
  function threadsHtml() {
    var l = ((letzte && letzte.threads) || []).filter(function (t) { return t.status !== 'fertig'; });
    if (!l.length) return '<p>Keine offenen Threads geladen.</p>';
    return '<ul>' + l.map(function (t) {
      return '<li><b>' + esc(t.titel) + '</b>' + (t.status === 'wartet auf Diego' ? ' (wartet auf dich)' : t.wichtig ? ' (wichtig)' : '') +
        (t.zusammenfassung || t.was ? '<br>' + esc(t.zusammenfassung || t.was) : '') +
        ((t.todos || []).length ? '<ul>' + t.todos.map(function (x) { return '<li>' + (x.erledigt ? '✓ ' : '○ ') + esc(x.text) + (x.neu && !x.erledigt ? ' (neu)' : '') + '</li>'; }).join('') + '</ul>' : '') + (t.link ? '<br><a href="' + esc(t.link) + '">' + esc(t.link) + '</a>' : '') + '</li>';
    }).join('') + '</ul>';
  }
  function designsHtml(ds) {
    if (!ds.length) return '<p>Heute noch keine Designvorschläge.</p>';
    return ds.map(function (x, i) { return '<h2>' + (i + 1) + '. ' + esc(x.titel) + (x.app ? ' · ' + esc(x.app) : '') + '</h2><img src="' + esc(x.bild) + '" alt="">'; }).join('');
  }
  function dokument(titel, inhalt) { return '<h1>' + esc(titel) + '</h1><div class="stand">DR Lab · ' + heute() + '</div>' + inhalt; }
  function alsPdf(titel, inhalt) {
    $('druck').innerHTML = dokument(titel, inhalt); blattZu();
    var bilder = [].slice.call($('druck').querySelectorAll('img'));
    Promise.all(bilder.map(function (im) { return im.complete ? 0 : new Promise(function (ok) { im.onload = im.onerror = ok; }); })).then(function () { setTimeout(function () { window.print(); }, 100); });
  }
  function alsWord(titel, inhalt, name) {
    var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>' + esc(titel) + '</title></head><body>' + dokument(titel, inhalt) + '</body></html>';
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff', html], { type: 'application/msword' }));
    a.download = name + '-' + new Date().toISOString().slice(0, 10) + '.doc'; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000); blattZu();
  }
  function blattZu() { $('blatt').classList.remove('an'); }
  function knopf(text, fn) { var b = document.createElement('button'); b.textContent = text; b.addEventListener('click', fn); $('blattInnen').appendChild(b); }
  $('runter').addEventListener('click', function () {
    var i = $('blattInnen'); i.innerHTML = '<b>Herunterladen</b>';
    knopf('📄 Threads als PDF', function () { alsPdf('Threads', threadsHtml()); });
    knopf('📝 Threads als Word', function () { alsWord('Threads', threadsHtml(), 'threads'); });
    knopf('🎨 Designvorschläge als PDF', function () { designsHolen().then(function (ds) { alsPdf('Designvorschläge', designsHtml(ds)); }); });
    knopf('📝 Designvorschläge als Word', function () { designsHolen().then(function (ds) { alsWord('Designvorschläge', designsHtml(ds), 'designvorschlaege'); }); });
    var videos = ((letzte && letzte.links) || []).concat(FESTE_LINKS).filter(function (x) { return x.video; });
    videos.forEach(function (v) { var a = document.createElement('a'); a.href = v.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = '🎬 ' + v.titel; i.appendChild(a); });
    var k = document.createElement('div'); k.className = 'klein'; k.textContent = 'PDF: im Teilen-Blatt «In Dateien sichern». Videos: öffnen, dann Teilen › Video sichern.'; i.appendChild(k);
    $('blatt').classList.add('an');
  });
  $('blatt').addEventListener('click', function (e) { if (e.target === $('blatt')) blattZu(); });

  function designsVorne() {
    designsHolen().then(function (ds) {
      var box = $('designs'); box.innerHTML = '';
      ds.slice(0, 3).forEach(function (x) {
        var f = document.createElement('figure'); var im = document.createElement('img'); im.src = x.bild; im.alt = x.titel || ''; im.loading = 'lazy';
        var c = document.createElement('figcaption'); c.textContent = x.app || x.titel || ''; f.append(im, c); box.appendChild(f);
      });
    });
  }

  function laden() {
    if (!quelle) { zeigen({}, 'Threads: einmal in der Nova-App auf «🎛 Zentrale» tippen.'); return; }
    fetch(quelle + (quelle.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); }).then(function (d) { letzte = d; zeigen(d); designsVorne(); })
      .catch(function () { zeigen({}, 'Threads gerade nicht erreichbar.'); });
  }
  laden();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) laden(); });
  setInterval(laden, 60000);
})();
</script>
</body>
</html>

<head>

<style>
/* Layout: one-hand phone app, 480px column, fixed tab bar, bottom-sheet details. Design system from the approved ChatGPT brief. */
:root{
  --bg:#F3F6F7; --surface:#FFFFFF; --ink:#17344A; --muted:#5B7282; --line:#DDE6EA;
  --primary:#0E4F6E; --primary-ink:#FFFFFF; --soft:#E3EEF3; --gold:#B98A2E; --gold-soft:#F6EDDA;
  --ok:#22C55E; --bad:#E5533D; --idle:#9AAAB4; --shadow:0 6px 20px rgba(14,47,64,.08);
  --display:"Young Serif",Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1820; --surface:#12232D; --ink:#E7EFF2; --muted:#9DB1BB; --line:#22394A;
  --primary:#13617F; --primary-ink:#F3F7F8; --soft:#163343; --gold:#E0B45C; --gold-soft:#33291A; --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1820; --surface:#12232D; --ink:#E7EFF2; --muted:#9DB1BB; --line:#22394A;
  --primary:#13617F; --primary-ink:#F3F7F8; --soft:#163343; --gold:#E0B45C; --gold-soft:#33291A; --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:8px 112px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 4px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:36px;height:36px;flex:none;border-radius:10px;display:block}
.brand>div{display:flex;flex-direction:column;min-width:0}
.brand small{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.brand b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.15}
.brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.brand svg{width:32px;height:32px}.brand b{font-size:17px}.brand small{display:none}.lang button{min-width:36px;padding:0 6px;font-size:12px}header.top{gap:8px}}
.lang{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.lang button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:0 9px;min-width:40px;min-height:40px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.demo-tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);background:var(--gold-soft);border-radius:999px;padding:3px 10px;margin-bottom:6px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:16px 0 0}
h1{font-family:var(--display);font-weight:400;font-size:31px;line-height:1.15;margin:4px 0 8px;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:23px;line-height:1.2;margin:0 0 12px;text-wrap:balance}
p{margin:0}
.lead{color:var(--muted);font-size:15px}
.stack{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.hero{background:var(--primary);color:var(--primary-ink);border-radius:var(--r);padding:24px;position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(14,79,110,.28)}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;border:30px solid rgba(255,255,255,.06);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero h2{color:var(--primary-ink);display:flex;align-items:center;gap:10px;margin-bottom:8px}
.hero h2 svg{width:26px;height:26px;stroke:var(--primary-ink)}
.row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:12px;border-top:1px solid rgba(255,255,255,.16)}
.row:first-of-type{border-top:0}
.field{min-width:0;flex:1}
.field label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.75;display:block;margin-bottom:2px}
.field input{background:transparent;border:0;border-bottom:1px dashed rgba(255,255,255,.45);color:var(--primary-ink);font:600 19px var(--body);width:100%;padding:4px 0;min-width:0}
.field input::placeholder{color:var(--primary-ink);opacity:.55;font-weight:500;font-size:15px}
.field input:focus{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;font-weight:600;font-size:16px;min-height:48px;padding:0 20px;cursor:pointer;background:var(--gold);color:#1B1408;text-decoration:none;transition:transform .15s ease}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.chip-btn{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.hero .btn.ghost{border-color:rgba(255,255,255,.4);color:var(--primary-ink)}
.btn:disabled{opacity:.6}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.status{display:flex;align-items:center;gap:10px;margin-top:16px;font-weight:600;font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--idle);flex:none}
.st-ok .dot{background:var(--ok);box-shadow:0 0 0 4px rgba(34,197,94,.25)}
.st-bad .dot{background:var(--bad)}
.st-run .dot{background:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.hint{font-size:13px;opacity:.75;margin-top:6px}
.wqr{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.wqr .code{background:#fff;border-radius:14px;padding:10px;width:156px;height:156px;flex:none;display:grid;place-items:center}
.wqr .code svg{width:100%;height:100%;display:block}
.wqr p{flex:1;min-width:150px;font-size:15px;margin:0}
ol.steps{list-style:none;padding:0;margin:0;counter-reset:s;display:flex;flex-direction:column}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:12px;padding-block:12px;border-top:1px solid var(--line)}
ol.steps li:first-child{border-top:0;padding-top:0}
ol.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--primary);font-weight:700;font-size:14px;display:grid;place-items:center}
ol.steps b{display:block;font-size:16px}
ol.steps span{color:var(--muted);font-size:15px}
details.more{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
details.more summary{cursor:pointer;font-weight:600;color:var(--primary);list-style:none;min-height:40px;display:flex;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";margin-left:auto;color:var(--muted);font-size:20px}
details.more[open] summary::after{content:"−"}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;padding:12px 16px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;min-height:64px;width:100%}
.item:first-child{border-top:0}
.item .ic{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center}
.item .ic svg{width:22px;height:22px;stroke:var(--primary)}
.item b{display:block;font-size:16px;font-weight:600}
.item span span{display:block;font-size:13px;color:var(--muted)}
.item .val{font-weight:700;font-variant-numeric:tabular-nums;color:var(--primary);font-size:15px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.chev{width:16px;height:16px;stroke:var(--muted)}
.keyrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.key{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.key small{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.key b{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1;color:var(--primary);font-variant-numeric:tabular-nums}
.photo{position:relative;height:190px;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);background:var(--soft)}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
.photo .cap{position:absolute;left:0;right:0;bottom:0;padding:48px 16px 12px;background:linear-gradient(180deg,rgba(9,28,38,0),rgba(9,28,38,.8));color:#fff;font-size:12px;letter-spacing:.06em}
.food{display:grid;grid-template-columns:88px 1fr;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);text-align:left;cursor:pointer;width:100%}
.food .thumb{width:88px;height:88px;border-radius:14px;overflow:hidden;background:var(--soft);display:block}
.food .thumb img,.food .thumb svg,.art,.art svg{width:100%;height:100%;object-fit:cover;display:block}
.food b{font-size:17px;display:block}
.food .sub{display:block;color:var(--muted);font-size:14px}
.food .hours{display:inline-block;margin-top:6px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--primary);background:var(--soft);border-radius:8px;padding:2px 8px;font-size:15px}
.food .hours.tbc{color:var(--muted);background:transparent;padding:0;font-weight:500;font-size:13px}
.big{display:block;position:relative;height:220px;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);border:0;padding:0;cursor:pointer;width:100%;text-align:left;background:var(--soft)}
.big>img,.big>.art{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover}
.big .txt{position:absolute;left:0;right:0;bottom:0;padding:56px 20px 18px;background:linear-gradient(180deg,rgba(9,28,38,0),rgba(9,28,38,.82));color:#fff}
.big .txt b{font-family:var(--display);font-weight:400;font-size:24px;display:block}
.big .txt span{font-size:14px;opacity:.92}
.big:active,.food:active,.item:active{transform:scale(.99)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;min-height:44px;padding:0 16px;font-weight:500;font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.lbl{font-size:13px;color:var(--muted);font-weight:600;display:block;margin:16px 0 6px}
input.plain,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:12px 14px;font:16px var(--body);min-height:48px}
textarea{min-height:88px;resize:vertical}
.err{color:var(--bad);font-weight:600;font-size:14px;margin-top:12px}
.result{border-radius:var(--r);padding:16px;background:var(--gold-soft);border:1px solid var(--gold);margin-top:16px}
.result b{display:block;margin-bottom:4px}
.result pre{white-space:pre-wrap;font:15px var(--body);margin:12px 0;background:var(--surface);border-radius:12px;padding:12px}
.note{font-size:13px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;cursor:pointer;border-radius:10px;min-height:48px}
nav.tabs svg{width:23px;height:23px;stroke:currentColor}
nav.tabs button[aria-current="page"]{color:var(--primary)}
nav.tabs button[aria-current="page"] svg{stroke-width:2.3}
svg{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#sheet{position:fixed;top:0;right:0;bottom:0;left:0;z-index:15;display:flex;align-items:flex-end;justify-content:center;background:rgba(9,22,30,.45)}
#sheet .panel{background:var(--surface);width:100%;max-width:480px;max-height:88%;overflow:auto;border-radius:24px 24px 0 0;padding:0 0 calc(24px + env(safe-area-inset-bottom,0px));position:relative}
#sheet .media{height:200px;position:relative;background:var(--soft);overflow:hidden}
#sheet .media>img,#sheet .media>.art{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover}
#sheet .body{padding:20px 24px 0}
#sheet dl{margin:16px 0 0;display:flex;flex-direction:column}
#sheet dl div{display:flex;justify-content:space-between;gap:16px;padding-block:12px;border-top:1px solid var(--line)}
#sheet dt{color:var(--muted)} #sheet dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
#sheet .close{position:absolute;top:12px;right:12px;z-index:2;width:44px;height:44px;border-radius:50%;border:0;background:rgba(9,22,30,.6);color:#fff;font-size:24px;cursor:pointer}
.hero h2 .wdemo{margin-left:auto;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px 10px}
.tbcpill{display:inline-block;font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:30}
#intro{position:fixed;top:0;right:0;bottom:0;left:0;z-index:20;background:#0B1820;color:#F3F6F4;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
#intro video{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover}
#intro::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;z-index:1;background:linear-gradient(180deg,rgba(11,24,32,.2) 0%,rgba(11,24,32,.05) 40%,rgba(11,24,32,.9) 80%)}
#intro .playv{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);z-index:3;width:72px;height:72px;border-radius:50%;border:0;background:rgba(243,246,244,.9);display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.35)}#intro .playv svg{width:30px;height:30px;fill:#0E4F6E;margin-left:4px}
#intro .in{position:relative;z-index:2;max-width:480px;width:100%;margin:0 auto;padding:24px 20px calc(32px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
#intro .in svg{width:52px;height:52px;border-radius:14px;display:block}
#intro small{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#E0B45C;font-weight:700}
#intro h1{color:#F3F6F4;font-size:38px;margin:0}
#intro p{color:#C9D8DF;font-size:17px}
#intro .btn{margin-top:8px;min-height:54px;font-size:17px}
#intro .skip{background:transparent;border:0;color:#C9D8DF;font-weight:500;font-size:15px;cursor:pointer;padding:10px;align-self:center}
#intro .lang{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;z-index:3;background:rgba(11,24,32,.55);border-color:rgba(255,255,255,.2)}
#intro .lang button{color:#C9D8DF}
#intro .lang button[aria-pressed="true"]{background:#F3F6F4;color:#0B1820}
#intro.out{transition:opacity .5s ease,transform .6s ease;opacity:0;transform:scale(1.06)}
#tour{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:6;padding-inline:16px}
#tour .bar{max-width:448px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#tour .dots{display:flex;gap:5px;flex:none}
#tour .dots i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.3}
#tour .dots i.on{opacity:1;background:var(--gold)}
#tour .lbl{flex:1;min-width:0;font-size:14px;font-weight:600}
#tour .btn{min-height:40px;padding:0 14px;font-size:14px}
#tour .x{background:transparent;border:0;color:inherit;opacity:.7;font-weight:600;font-size:22px;cursor:pointer;padding:4px 8px;min-height:40px}
body.touring .app{padding-bottom:180px}
@media (max-width:400px){#tour .dots{display:none}#tour .lbl{font-size:13px}}
@media (prefers-reduced-motion:no-preference){section.view{animation:in .35s cubic-bezier(.2,.7,.2,1)}#sheet .panel{animation:up .3s cubic-bezier(.2,.7,.2,1)}
  @keyframes in{from{opacity:.55;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}}
@media (prefers-reduced-motion:no-preference){#intro::before{opacity:0}#intro .in>*{opacity:0}#intro.go::before{opacity:1;animation:introBg 1.2s ease 1.8s both}#intro.go .in>*{opacity:1;animation:introIn .8s cubic-bezier(.2,.7,.2,1) both}
  #intro.go .in>*:nth-child(1){animation-delay:2s}#intro.go .in>*:nth-child(2){animation-delay:2.15s}#intro.go .in>*:nth-child(3){animation-delay:2.3s}#intro.go .in>*:nth-child(4){animation-delay:2.45s}#intro.go .in>*:nth-child(n+5){animation-delay:2.7s}
  @keyframes introIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes introBg{from{opacity:0}to{opacity:1}}}
#filmPop{position:fixed;top:0;right:0;bottom:0;left:0;z-index:30;background:rgba(5,12,16,.94);display:flex;align-items:center;justify-content:center;padding:16px;transition:opacity .4s}
#filmPop.out{opacity:0}
#filmPop .fp-box{position:relative;width:100%;max-width:960px;display:flex;flex-direction:column;gap:12px}
#filmPop video{width:100%;height:auto;display:block;border-radius:16px;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#filmPop .playv{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;border:0;background:rgba(243,246,244,.9);display:grid;place-items:center;cursor:pointer}
#filmPop .playv svg{width:30px;height:30px;fill:#0E4F6E;margin-left:4px}
#filmPop .fp-bar{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap}
#filmPop .fp-bar button{min-height:48px;padding:0 20px;border-radius:14px;font:inherit;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,.35);background:transparent;color:#F3F6F4}
#filmPop .fp-bar #filmSkip{background:#B98A2E;border-color:#B98A2E;color:#17344A}
@media (prefers-reduced-motion:reduce){#intro.out{transition:none}}
</style>
</head>
<body>

<div id="filmPop" role="dialog" aria-label="DR Lab">
  <div class="fp-box">
    <video id="filmVid" playsinline muted preload="auto" poster="propuesta/film-poster.jpg"><source src="propuesta/film-es.mp4?v=2" type="video/mp4"><source src="propuesta/film-es.webm?v=2" type="video/webm"></video>
    <button id="filmPlay" class="playv" type="button" aria-label="Play" hidden><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    <div class="fp-bar"><button id="filmSound" type="button" data-t="filmSound"></button><button id="filmSkip" type="button" data-t="filmSkip"></button></div>
  </div>
</div>

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get("gt-lang")||"es";if(!T[lang])lang="es";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CHEV='<svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
const picked=new Set();let extraPre="";let net={s:"idle"};

function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),1600)}
function selectEl(el){try{if(el.select)el.select();else{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}}catch(e){}}
async function copy(text,el){try{await navigator.clipboard.writeText(text);toast(T[lang].copied)}catch(e){if(el)selectEl(el);toast(T[lang].copyFail)}}

function render(){
  const t=T[lang];document.documentElement.lang=lang;
  $$("[data-t]").forEach(el=>{const v=t[el.dataset.t];el.textContent=typeof v==="string"?v.replace(/Wi-Fi/g,"Wi\u2060-\u2060Fi"):v});
  $$("[data-ph]").forEach(el=>{el.placeholder=t[el.dataset.ph]});
  $$("[data-alt]").forEach(el=>{el.alt=t[el.dataset.alt]});
  $$(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  const li=a=>a.map(([b,s])=>`<li><div><b>${esc(b)}</b><span>${esc(s)}</span></div></li>`).join("");
  $("#steps3").innerHTML=li(t.steps3);$("#stepsMore").innerHTML=li(t.stepsMore);
  $("#hotelList").innerHTML=t.hotel.map((h,i)=>i===0?"":`<button class="item" data-sheet="hotel:${i}"><span class="ic"><svg viewBox="0 0 24 24">${IC[h[0]]}</svg></span><span><b>${esc(h[1])}</b><span>${esc(h[2])}</span></span><span class="val">${esc(h[3])}${CHEV}</span></button>`).join("");
  $("#foodList").innerHTML=t.food.map((f,i)=>`<button class="food" data-sheet="food:${i}"><span class="thumb">${MEDIA[f[0]]}</span><span><b>${esc(f[1])}</b><span class="sub">${esc(f[2])}</span><span class="hours${f[3]?"":" tbc"}">${esc(f[3]||t.hoursTbc)}</span></span></button>`).join("");
  $("#enjoyList").innerHTML=t.enjoy.map((e,i)=>`<button class="big" data-sheet="enjoy:${i}">${MEDIA[e[0]]}<span class="txt"><b>${esc(e[1])}</b><span>${esc(e[2])}</span></span></button>`).join("");
  $("#reqChips").innerHTML=t.reqs.map((r,i)=>`<button class="chip" data-i="${i}" aria-pressed="${picked.has(i)}">${esc(r)}</button>`).join("");
  showNet();drawWqr();tourShow();if(!$("#reqResult").hidden)buildReq(true);
}
function wifiEsc(v){return v.replace(/([\\;,:"])/g,"\\$1")}
function drawWqr(){const t=T[lang],ss=$("#ssid").value.trim(),pw=$("#pass").value,box=$("#wqr");
  box.setAttribute("aria-label",t.qrAlt);const ok=ss&&typeof qrcode==="function";box.hidden=!ok;$("#wqrTxt").textContent=ok?t.qrHint:t.qrEmpty;if(!ok)return;
  const q=qrcode(0,"M");q.addData("WIFI:T:"+(pw?"WPA":"nopass")+";S:"+wifiEsc(ss)+";"+(pw?"P:"+wifiEsc(pw)+";":"")+";");q.make();
  box.innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true})}
function showNet(){const t=T[lang],el=$("#netStatus");const m={idle:["",t.stIdle],run:["st-run",t.testing],ok:["st-ok",(net.ms>1500?t.stSlow:t.stOk).replace("{ms}",net.ms)],bad:["st-bad",t.stBad]}[net.s];
  el.className="status "+m[0];el.lastElementChild.textContent=m[1];$("#testBtn").textContent=net.s==="run"?t.testing:t.test}
function ping1(url){return new Promise(res=>{const sc=document.createElement("script");const t0=performance.now();
  const to=setTimeout(()=>{sc.remove();res(-1)},5000);
  sc.onload=()=>{clearTimeout(to);sc.remove();res(Math.round(performance.now()-t0))};sc.onerror=()=>{clearTimeout(to);sc.remove();res(-1)};
  sc.src=url+"?t="+Date.now();document.head.appendChild(sc)})}
async function test(){const b=$("#testBtn");b.disabled=true;net={s:"run"};showNet();let ms=-1;
  for(const u of ["https://cdnjs.cloudflare.com/ajax/libs/js-cookie/3.0.5/js.cookie.min.js","https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js","https://unpkg.com/js-cookie@3.0.5/dist/js.cookie.min.js"]){ms=await ping1(u);if(ms>=0)break}
  net=ms>=0?{s:"ok",ms}:{s:"bad"};b.disabled=false;showNet()}

function openSheet(kind,i){const t=T[lang];const src=t[kind][i];const id=src[0],title=src[1],sub=src[2];
  const rows=kind==="enjoy"?src[3]:src[4],note=kind==="enjoy"?src[4]:src[5];
  const cta=PRE[id]!==undefined?(id==="spa"?t.massage:t.requestThis):"";
  $("#sheetMedia").innerHTML=MEDIA[id]||"";
  $("#sheetBody").innerHTML=`<h2>${esc(title)}</h2><p class="lead">${esc(sub)}</p><dl>${rows.map(([a,b])=>`<div><dt>${esc(a)}</dt><dd>${esc(b)}</dd></div>`).join("")}</dl>${note?`<p class="note" style="margin-top:12px">${esc(note)}</p>`:""}<p style="margin-top:12px"><span class="tbcpill">${esc(t.tbc)}</span></p>${cta?`<div style="margin-top:16px"><button class="btn primary block" data-go="requests" data-pre="${id}">${esc(cta)}</button></div>`:""}`;
  $("#sheet").hidden=false;$("#sheet .panel").scrollTop=0;$("#sheetX").focus()}
function closeSheet(){$("#sheet").hidden=true}
function preselect(id){const t=T[lang],p=PRE[id];if(p>=0)picked.add(p);else{picked.add(5);const add=p===-1?t.wifiHelp:t.massage;const x=$("#extra");if(!x.value.includes(add))x.value=(x.value?x.value+"\n":"")+add}}

function buildReq(silent){const t=T[lang],room=$("#room").value.trim(),extra=$("#extra").value.trim(),err=$("#reqErr");
  let msg="";if(!picked.size&&!extra)msg=t.errPick;else if(!room)msg=t.errRoom;
  if(msg){if(!silent){err.textContent=msg;err.hidden=false;$("#reqResult").hidden=true}return}
  err.hidden=true;const lines=[t.reqHead,""];[...picked].sort().forEach(i=>{if(i!==5||!extra)lines.push("• "+t.reqs[i])});if(extra)extra.split("\n").forEach(l=>l.trim()&&lines.push("• "+l.trim()));
  lines.push("",t.reqRoom+" "+room+(lang==="zh"?"。":". ")+t.reqBye);$("#reqText").textContent=lines.join("\n");$("#reqResult").hidden=false}
function send(){buildReq(false);if($("#reqResult").hidden)return;
  /* Echter Versand später: if(!CONFIG.demo&&CONFIG.requestEndpoint) fetch(CONFIG.requestEndpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({room,requests,text,lang})}) mit Bestätigung/Fehler */
  $("#reqResult").scrollIntoView({behavior:"smooth",block:"center"})}

const VIEWS=["wifi","hotel","food","enjoy","requests"];let tourI=-1;
function go(v){closeSheet();$$("section.view").forEach(s=>s.hidden=s.id!=="v-"+v);
  $$("nav.tabs button").forEach(b=>b.dataset.go===v?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
  scrollTo({top:0});if(tourI>=0){tourI=VIEWS.indexOf(v);tourShow()}}
function tourShow(){const t=T[lang];if(tourI<0){$("#tour").hidden=true;document.body.classList.remove("touring");return}
  $("#tour").hidden=false;document.body.classList.add("touring");
  $("#tourDots").innerHTML=VIEWS.map((_,i)=>`<i class="${i===tourI?"on":""}"></i>`).join("");
  $("#tourLbl").textContent=t.tourStops[tourI];$("#tourNext").textContent=tourI===VIEWS.length-1?t.tourDone:t.tourNext+" →"}
function tourGo(i){tourI=i;if(i>=0)go(VIEWS[i]);tourShow()}
function closeIntro(tour){const el=$("#intro");el.classList.add("out");setTimeout(()=>{el.hidden=true;try{$("#introVid").pause()}catch(e){}},550);if(tour)tourGo(0);else go("wifi")}

document.addEventListener("click",e=>{
  const s=e.target.closest("[data-sheet]");if(s){const[k,i]=s.dataset.sheet.split(":");openSheet(k,+i);return}
  const g=e.target.closest("[data-go]");if(g){if(g.dataset.pre)preselect(g.dataset.pre);go(g.dataset.go);render();return}
  const c=e.target.closest("[data-copyfrom]");if(c){const inp=$("#"+c.dataset.copyfrom);if(inp.value)copy(inp.value,inp);else{toast(T[lang].nothing);inp.focus()}return}
  const l=e.target.closest(".lang button");if(l){lang=l.dataset.lang;store.set("gt-lang",lang);render();return}
  const ch=e.target.closest("#reqChips .chip");if(ch){const i=+ch.dataset.i;picked.has(i)?picked.delete(i):picked.add(i);ch.setAttribute("aria-pressed",picked.has(i));if(!$("#reqResult").hidden)buildReq(true);return}
});
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet()});

const DIRECT=/[?&](app|direkt)\b/.test(location.search)||location.hash==="#app";
if(DIRECT){$("#intro").hidden=true;try{const iv=$("#introVid");iv.removeAttribute("autoplay");iv.pause();iv.preload="none"}catch(e){}}
function startIntro(){$("#intro").classList.add("go");const v=$("#introVid");try{v.currentTime=0}catch(e){}}
(function(){const pop=$("#filmPop"),f=$("#filmVid"),fb=$("#filmPlay");
  if(DIRECT){if(pop)pop.hidden=true;return}if(!pop){startIntro();return}
  pop.hidden=false;try{$("#introVid").pause()}catch(e){}
  const close=()=>{pop.classList.add("out");try{f.pause()}catch(e){}setTimeout(()=>{pop.hidden=true},400);try{$("#introVid").play().catch(()=>{})}catch(e){}startIntro()};
  const showBtn=()=>{fb.hidden=false};f.muted=true;
  try{const pr=f.play();if(pr&&pr.catch)pr.catch(showBtn)}catch(e){showBtn()}
  setTimeout(()=>{if(f.paused&&!pop.hidden)showBtn()},2500);
  f.addEventListener("playing",()=>{fb.hidden=true});f.addEventListener("ended",close);
  fb.onclick=()=>{const pr=f.play();if(pr&&pr.catch)pr.catch(()=>{})};
  $("#filmSkip").onclick=close;
  $("#filmSound").onclick=()=>{f.muted=!f.muted;if(f.paused)f.play().catch(()=>{});$("#filmSound").textContent=T[lang][f.muted?"filmSound":"soundOff"]};
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!pop.hidden)close()});
})();
(function(){const v=$("#introVid"),b=$("#playVid");if(!v||DIRECT)return;v.muted=true;if(!$("#filmPop").hidden){v.pause();v.addEventListener("playing",()=>{b.hidden=true});b.onclick=()=>{const pr=v.play();if(pr&&pr.catch)pr.catch(()=>{})};return}
  const show=()=>{if(!$("#intro").hidden)b.hidden=false};
  try{const pr=v.play();if(pr&&pr.catch)pr.catch(show)}catch(e){show()}
  setTimeout(()=>{if(v.paused)show()},2500);
  b.onclick=()=>{v.muted=true;const pr=v.play();if(pr&&pr.then)pr.then(()=>{b.hidden=true}).catch(()=>{});else b.hidden=true};
  v.addEventListener("playing",()=>{b.hidden=true})})();
</script>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E4F6E">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Golden Taurus Gäste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-hand phone app, content column max 480px, fixed bottom tab bar; sea + sand + a single gold accent */
:root{
  --bg:#f3f6f7; --surface:#ffffff; --ink:#0f2a3a; --muted:#5a6f7b; --line:#dbe4e8;
  --sea:#0e4f6e; --sea-soft:#e2eef3; --gold:#b98a2e; --gold-soft:#f6ecd6; --ok:#2f7d55; --warn:#b5651d;
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1820; --surface:#12232d; --ink:#e7eff2; --muted:#9db1bb; --line:#22394a;
  --sea:#6fb6d6; --sea-soft:#163343; --gold:#e0b45c; --gold-soft:#33291a; --ok:#6cc495; --warn:#e8a062; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1820; --surface:#12232d; --ink:#e7eff2; --muted:#9db1bb; --line:#22394a;
  --sea:#6fb6d6; --sea-soft:#163343; --gold:#e0b45c; --gold-soft:#33291a; --ok:#6cc495; --warn:#e8a062; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:12px 110px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 4px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand small{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600}
.brand b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.15}
.lang{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:6px 10px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--sea);color:var(--bg)}
h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.15;margin:18px 0 6px;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0 0 10px;text-wrap:balance}
p{margin:0}
.lead{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.wifi{background:var(--sea);color:var(--bg);border:0;position:relative;overflow:hidden}
.wifi::after{content:"";position:absolute;right:-60px;bottom:-60px;width:200px;height:200px;border-radius:50%;
  border:28px solid currentColor;opacity:.07;pointer-events:none}
.wifi>*{position:relative;z-index:1}
.wifi h2{color:var(--bg)}
.wifi .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:10px;border-top:1px solid color-mix(in srgb,var(--bg) 22%,transparent)}
.wifi .row:first-of-type{border-top:0}
.wifi label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.8;display:block}
.wifi input{background:transparent;border:0;border-bottom:1px dashed color-mix(in srgb,var(--bg) 45%,transparent);color:var(--bg);
  font:600 19px var(--body);width:100%;padding:2px 0;min-width:0}
.wifi input::placeholder{color:var(--bg);opacity:.55;font-weight:500;font-size:15px}
.wifi input:focus{outline:2px solid var(--gold);outline-offset:2px}
.field{min-width:0;flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;font:600 15px var(--body);
  padding:12px 16px;cursor:pointer;background:var(--gold);color:#1b1408;text-decoration:none}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.wifi .btn.ghost{border-color:color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg)}
.btn:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.status{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.st-ok .dot{background:#5fd39a} .st-bad .dot{background:#ff8a6b}
ol.steps{list-style:none;padding:0;margin:0;counter-reset:s;display:flex;flex-direction:column}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:12px;padding-block:12px;border-top:1px solid var(--line)}
ol.steps li:first-child{border-top:0;padding-top:2px}
ol.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--sea-soft);color:var(--sea);
  font-weight:700;font-size:14px;display:grid;place-items:center}
ol.steps b{display:block}
ol.steps span{color:var(--muted);font-size:15px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;cursor:pointer;
  color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:6px}
.tile svg{width:24px;height:24px;stroke:var(--sea)}
.tile b{font-size:15px}
.tile span{font-size:13px;color:var(--muted)}
dl.facts{margin:0;display:flex;flex-direction:column}
dl.facts div{display:flex;justify-content:space-between;gap:14px;padding-block:10px;border-top:1px solid var(--line)}
dl.facts div:first-child{border-top:0;padding-top:0}
dt{color:var(--muted)} dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--gold-soft);color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:500 14px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sea-soft);border-color:var(--sea);color:var(--sea)}
textarea,input.plain{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;font:15px var(--body)}
textarea{min-height:90px;resize:vertical}
.out{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px;white-space:pre-wrap;font-size:15px;margin-top:12px}
.copyline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.copyline code{font:600 15px var(--body);word-break:break-all;min-width:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:600 11px var(--body);display:flex;flex-direction:column;
  align-items:center;gap:3px;padding:6px 2px;cursor:pointer;border-radius:10px}
nav.tabs svg{width:22px;height:22px;stroke:currentColor}
nav.tabs button[aria-current="page"]{color:var(--sea)}
svg{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;
  font-weight:600;font-size:14px;z-index:9}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:22px}
@media (prefers-reduced-motion:no-preference){section.view{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}

#intro{position:fixed;inset:0;z-index:20;background:#0b1820;color:#f3f6f4;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
#intro video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#intro::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(11,24,32,.15) 0%,rgba(11,24,32,.1) 40%,rgba(11,24,32,.88) 78%)}
#intro .in{position:relative;z-index:2;max-width:480px;width:100%;margin:0 auto;padding:24px 20px calc(36px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
#intro small{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#e0b45c;font-weight:600}
#intro h1{color:#f3f6f4;font-size:38px;margin:0}
#intro p{color:#c9d8df;font-size:17px}
#intro .btn{margin-top:10px;padding:16px;font-size:17px}
#intro .skip{background:transparent;border:0;color:#c9d8df;font:500 14px var(--body);cursor:pointer;padding:8px;align-self:center}
#intro .introlang{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;z-index:3;background:rgba(11,24,32,.55);border-color:rgba(255,255,255,.2)}
#intro .introlang button{color:#c9d8df}
#intro .introlang button[aria-pressed="true"]{background:#f3f6f4;color:#0b1820}
#intro.out{transition:opacity .5s ease,transform .6s ease;opacity:0;transform:scale(1.06)}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-top:18px}
.eyebrow+h1{margin-top:4px}
#tour{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;padding-inline:16px}
#tour .bar{max-width:448px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#tour .dots{display:flex;gap:5px;flex:none}
#tour .dots i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.3}
#tour .dots i.on{opacity:1;background:var(--gold)}
#tour .lbl{flex:1;min-width:0;font-size:14px;font-weight:600}
#tour .x{background:transparent;border:0;color:inherit;opacity:.7;font:600 20px var(--body);cursor:pointer;padding:4px 8px}
body.touring .app{padding-bottom:180px}
@media (max-width:400px){#tour .dots{display:none}#tour .lbl{font-size:13px}}
@media (prefers-reduced-motion:reduce){#intro.out{transition:none}}
</style>
</head>

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get("gt-lang")||((navigator.language||"de").slice(0,2));
if(!T[lang])lang="de";
const picked=new Set();let lastNet=null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

function toast(msg){const d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),1600)}
async function copy(text,el){try{await navigator.clipboard.writeText(text);toast(T[lang].copied)}catch(e){
  if(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast(T[lang].copyFail)}}

function facts(id,rows){$(id).innerHTML=rows.map(([a,b])=>`<div><dt>${a}</dt><dd>${b}</dd></div>`).join("")}

function render(){
  const t=T[lang];document.documentElement.lang=lang;
  $$("[data-t]").forEach(el=>{el.textContent=t[el.dataset.t]});
  $$("[data-ph]").forEach(el=>{el.placeholder=t[el.dataset.ph]});
  $$(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  $("#fixSteps").innerHTML=t.steps.map(([a,b])=>`<li><div><b>${a}</b><span>${b}</span></div></li>`).join("");
  facts("#hotelFacts",t.facts);facts("#foodFacts",t.food);
  $("#enjoyList").innerHTML=t.enjoy.map(([a,b,c])=>`<div class="card"><div class="copyline" style="margin-bottom:6px"><h2 style="margin:0">${a}</h2><span class="pill">${c}</span></div><p class="lead">${b}</p></div>`).join("");
  $("#reqChips").innerHTML=t.reqs.map((r,i)=>`<button class="chip" data-i="${i}" aria-pressed="${picked.has(i)}">${r}</button>`).join("");
  $$("#reqChips .chip").forEach(c=>c.onclick=()=>{const i=+c.dataset.i;picked.has(i)?picked.delete(i):picked.add(i);c.setAttribute("aria-pressed",picked.has(i));req()});
  showNet();req();
}
function req(){const t=T[lang];const room=$("#room").value.trim(),extra=$("#extra").value.trim();
  if(!picked.size&&!extra){$("#reqOut").textContent=t.reqEmpty;return}
  const lines=[t.reqHead,""];[...picked].sort().forEach(i=>lines.push("• "+t.reqs[i]));if(extra)lines.push("• "+extra);
  lines.push("",(room?t.reqRoom+" "+room+". ":"")+t.reqBye);$("#reqOut").textContent=lines.join("\n")}
function showNet(){const t=T[lang],el=$("#netStatus");let cls,txt;
  if(lastNet===null){cls=navigator.onLine?"st-ok":"st-bad";txt=navigator.onLine?t.onlineNoMs:t.offline}
  else if(lastNet<0){cls="st-bad";txt=t.offline}
  else{cls="st-ok";txt=(lastNet>1500?t.onlineSlow:t.online).replace("{ms}",lastNet)}
  el.className="status "+cls;el.lastElementChild.textContent=txt}
function ping1(url){return new Promise(res=>{const sc=document.createElement("script");const t0=performance.now();
  const to=setTimeout(()=>{sc.remove();res(-1)},5000);
  sc.onload=()=>{clearTimeout(to);sc.remove();res(Math.round(performance.now()-t0))};
  sc.onerror=()=>{clearTimeout(to);sc.remove();res(-1)};
  sc.src=url+"?t="+Date.now();document.head.appendChild(sc)})}
async function ping(){for(const u of ["https://cdnjs.cloudflare.com/ajax/libs/js-cookie/3.0.5/js.cookie.min.js","https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js","https://unpkg.com/js-cookie@3.0.5/dist/js.cookie.min.js"]){const ms=await ping1(u);if(ms>=0)return ms}return -1}
async function test(){const b=$("#testBtn");b.textContent=T[lang].testing;b.disabled=true;
  lastNet=await ping();b.disabled=false;b.textContent=T[lang].test;showNet()}

function go(v){$$("section.view").forEach(s=>s.hidden=s.id!=="v-"+v);
  $$("nav.tabs button").forEach(b=>b.dataset.go===v?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
  scrollTo({top:0});store.set("gt-tab",v);if(typeof tourI!=="undefined"&&tourI>=0){tourI=STOPS.indexOf(v);tourShow()}}
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g){go(g.dataset.go)}
  const c=e.target.closest("[data-copy]");if(c)copy(c.dataset.copy,c.previousElementSibling)});
$$(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;store.set("gt-lang",lang);render()});
["ssid","pass"].forEach(id=>{const el=$("#"+id);el.value=store.get("gt-"+id)||"";el.oninput=()=>store.set("gt-"+id,el.value)});
$("#copyPass").onclick=()=>{const v=$("#pass").value;if(v)copy(v,null);else $("#pass").focus()};
$("#testBtn").onclick=test;$("#copyReq").onclick=()=>{if(picked.size||$("#extra").value.trim())copy($("#reqOut").textContent,$("#reqOut"));else toast(T[lang].reqEmpty)};$("#room").oninput=req;$("#extra").oninput=req;
addEventListener("online",()=>{lastNet=null;showNet()});addEventListener("offline",()=>{lastNet=-1;showNet()});

const STOPS=["wifi","hotel","food","enjoy","help"];let tourI=-1;
function tourShow(){const t=T[lang];if(tourI<0){$("#tour").hidden=true;document.body.classList.remove("touring");return}
  $("#tour").hidden=false;document.body.classList.add("touring");
  $("#tourDots").innerHTML=STOPS.map((_,i)=>`<i class="${i===tourI?"on":""}"></i>`).join("");
  $("#tourLbl").textContent=t.tourStops[tourI];$("#tourNext").textContent=tourI===STOPS.length-1?t.tourDone:t.tourNext+" →"}
function tourGo(i){tourI=i;if(i>=0)go(STOPS[i]);tourShow()}
$("#tourNext").onclick=()=>tourGo(tourI+1<STOPS.length?tourI+1:-1);
$("#tourX").onclick=()=>tourGo(-1);$("#tourStart").onclick=()=>tourGo(0);
function closeIntro(tour){const el=$("#intro");el.classList.add("out");setTimeout(()=>{el.hidden=true;try{$("#introVid").pause()}catch(e){}},550);
  if(tour)tourGo(0);else go("wifi")}
$("#enterBtn").onclick=()=>closeIntro(true);$("#skipBtn").onclick=()=>closeIntro(false);
const _render=render;render=function(){_render();tourShow()};
render();
const h=location.hash.slice(1);go(["wifi","hotel","food","enjoy","help"].includes(h)?h:"wifi");

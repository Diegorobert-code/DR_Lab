<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Otti</title>
<meta name="theme-color" content="#0b1a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Otti">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { --nacht:#0b1a3a; --nacht2:#16306b; --gold:#f5c542; --text:#f4f1e8; --leise:#b9c3e0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { background:radial-gradient(120% 80% at 50% 0%, var(--nacht2), var(--nacht) 70%); color:var(--text);
    font:16px/1.4 system-ui, -apple-system, sans-serif; display:flex; flex-direction:column; align-items:center;
    padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px); overflow:hidden; }
  .sterne { position:fixed; inset:0; pointer-events:none; background-image:
    radial-gradient(2px 2px at 12% 18%, #fff8 50%, transparent 51%), radial-gradient(1.5px 1.5px at 78% 12%, #fff9 50%, transparent 51%),
    radial-gradient(2px 2px at 64% 30%, #fff6 50%, transparent 51%), radial-gradient(1.5px 1.5px at 30% 8%, #fff7 50%, transparent 51%),
    radial-gradient(2px 2px at 90% 40%, #fff5 50%, transparent 51%), radial-gradient(1.5px 1.5px at 6% 44%, #fff6 50%, transparent 51%); }
  h1 { margin:4px 0 0; font-size:22px; letter-spacing:.5px; color:var(--gold); }
  .status { min-height:22px; color:var(--leise); font-size:15px; margin:2px 0 10px; text-align:center; }
  .buehne { position:relative; width:min(86vw, 420px); aspect-ratio:510/540; border-radius:28px; overflow:hidden;
    box-shadow:0 18px 50px #0008, 0 0 0 3px #f5c54233; transform-origin:50% 90%; transition:box-shadow .3s; }
  .buehne.hoert { box-shadow:0 18px 50px #0008, 0 0 0 4px #7fd4ff, 0 0 40px #7fd4ff66; }
  .buehne.spricht { box-shadow:0 18px 50px #0008, 0 0 0 4px var(--gold), 0 0 44px #f5c54277; }
  .buehne img, .buehne video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .12s linear; }
  .buehne .an { opacity:1; }
  .atmen { animation:atmen 3.6s ease-in-out infinite; }
  @keyframes atmen { 50% { transform:scale(1.012) translateY(-2px); } }
  .text { width:min(92vw, 460px); flex:1; min-height:0; overflow-y:auto; margin-top:14px; display:flex; flex-direction:column; gap:8px;
    mask-image:linear-gradient(transparent, #000 18px); -webkit-mask-image:linear-gradient(transparent, #000 18px); padding-top:14px; }
  .z { padding:8px 12px; border-radius:14px; max-width:86%; white-space:pre-wrap; }
  .z.du { align-self:flex-end; background:#24386e; }
  .z.otti { align-self:flex-start; background:#f4f1e8; color:#22201a; }
  .knopf { margin-top:12px; width:88px; height:88px; border-radius:50%; border:0; cursor:pointer; font-size:34px;
    background:var(--gold); color:#2a1d00; box-shadow:0 10px 28px #0007; display:grid; place-items:center; flex:none;
    transition:transform .1s, background .2s; }
  .knopf:active { transform:scale(.94); }
  .knopf.aktiv { background:#d6304a; color:#fff; }
  .knopf:focus-visible { outline:3px solid #fff; outline-offset:4px; }
  .hinweis { color:var(--leise); font-size:13px; margin-top:8px; text-align:center; min-height:18px; }
  @media (prefers-reduced-motion: reduce) { .atmen { animation:none; } }
</style>
</head>
<body>
<div class="sterne"></div>
<h1>Otti</h1>
<div class="status" id="status">Tipp auf den Knopf und rede mit mir.</div>

<div class="buehne atmen" id="buehne" role="img" aria-label="Otti der Igel">
  <img id="ruhig" class="an" src="otti-anruf.jpg" alt="">
  <video id="winkt" src="otti-anruf-winkt.mp4" muted playsinline preload="auto"></video>
  <video id="spricht" src="otti-spricht.mp4" muted playsinline loop preload="auto"></video>
</div>

<div class="text" id="text" aria-live="polite"></div>

<button class="knopf" id="knopf" type="button" aria-label="Gespräch starten">🎙</button>
<div class="hinweis" id="hinweis"></div>

<script src="elevenlabs-client-1.26.0.js"></script>
<script>
(function () {
  // Live-Gespräch mit Otti: ElevenLabs Agent (hören, denken mit Claude, sprechen mit Ottis Stimme).
  // Der Agent ist nur von dieser Adresse aus erreichbar und hat ein Tageslimit.
  var AGENT = 'agent_4801m55hqwdpeq0ry4awvx45rz5t';
  var $ = function (id) { return document.getElementById(id); };
  var buehne = $('buehne'), ruhig = $('ruhig'), winkt = $('winkt'), spricht = $('spricht');
  var knopf = $('knopf'), status = $('status'), text = $('text'), hinweis = $('hinweis');
  var conv = null, startet = false, zustand = 'ruhig', puls = 0;

  function zeige(was) {
    if (was === zustand) return;
    zustand = was;
    [ruhig, winkt, spricht].forEach(function (e) { e.classList.remove('an'); });
    if (was === 'winkt') {
      winkt.currentTime = 0; winkt.classList.add('an');
      var p = winkt.play(); if (p && p.catch) p.catch(function () {});
    } else if (was === 'spricht') {
      spricht.classList.add('an');
      var q = spricht.play(); if (q && q.catch) q.catch(function () {});
    } else {
      ruhig.classList.add('an'); spricht.pause();
    }
  }
  winkt.addEventListener('ended', function () { if (zustand === 'winkt') zeige(conv && conv.__spricht ? 'spricht' : 'ruhig'); });

  // Videos beim ersten Tippen freischalten, damit sie danach sofort laufen (iPhone).
  var frei = false;
  function freischalten() {
    if (frei) return; frei = true;
    [winkt, spricht].forEach(function (v) { var p = v.play(); if (p && p.then) p.then(function () { v.pause(); v.currentTime = 0; }).catch(function () {}); });
  }

  function zeile(wer, t) {
    var d = document.createElement('div'); d.className = 'z ' + wer; d.textContent = t;
    text.appendChild(d); text.scrollTop = text.scrollHeight;
    while (text.children.length > 30) text.removeChild(text.firstChild);
  }

  // Otti wippt im Takt seiner Stimme.
  function takt() {
    if (conv) {
      var v = 0; try { v = conv.getOutputVolume() || 0; } catch (e) {}
      puls = puls * 0.6 + v * 0.4;
      buehne.style.transform = conv.__spricht ? 'scale(' + (1 + Math.min(puls, 1) * 0.05).toFixed(3) + ') translateY(' + (-Math.min(puls, 1) * 6).toFixed(1) + 'px)' : '';
    } else buehne.style.transform = '';
    requestAnimationFrame(takt);
  }
  requestAnimationFrame(takt);

  function knopfZeigen() {
    var an = !!conv || startet;
    knopf.classList.toggle('aktiv', an);
    knopf.textContent = an ? '■' : '🎙';
    knopf.setAttribute('aria-label', an ? 'Gespräch beenden' : 'Gespräch starten');
  }

  async function starten() {
    if (startet || conv) return;
    startet = true; knopfZeigen(); freischalten();
    status.textContent = 'Otti wacht auf …'; hinweis.textContent = '';
    try {
      await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      startet = false; knopfZeigen();
      status.textContent = 'Ich brauche das Mikrofon.';
      hinweis.textContent = 'Einstellungen › Safari › Mikrofon erlauben, dann nochmal tippen.';
      return;
    }
    try {
      var c = await ElevenLabsClient.Conversation.startSession({
        agentId: AGENT,
        connectionType: 'webrtc',
        onConnect: function () { status.textContent = 'Otti hört zu.'; zeige('winkt'); },
        onDisconnect: function () { ende('Bis bald! Tipp auf den Knopf, dann bin ich wieder da.'); },
        onError: function (m) { hinweis.textContent = 'Fehler: ' + (m || 'unbekannt'); },
        onMessage: function (m) { if (m && m.message) zeile(m.source === 'user' ? 'du' : 'otti', m.message); },
        onModeChange: function (m) {
          var sp = m && m.mode === 'speaking';
          if (conv) conv.__spricht = sp;
          buehne.classList.toggle('spricht', sp); buehne.classList.toggle('hoert', !sp);
          status.textContent = sp ? 'Otti spricht …' : 'Otti hört zu.';
          if (zustand !== 'winkt') zeige(sp ? 'spricht' : 'ruhig');
        }
      });
      conv = c; startet = false; knopfZeigen();
      buehne.classList.add('hoert');
    } catch (e) {
      startet = false; knopfZeigen();
      status.textContent = 'Otti schläft gerade.';
      hinweis.textContent = 'Keine Verbindung. Internet prüfen und nochmal tippen.';
    }
  }

  function ende(t) {
    conv = null; startet = false;
    buehne.classList.remove('hoert', 'spricht');
    zeige('ruhig'); knopfZeigen();
    if (t) status.textContent = t;
  }

  knopf.addEventListener('click', function () {
    if (conv) { var c = conv; ende('Bis bald!'); c.endSession().catch(function () {}); }
    else starten();
  });
  // Auf Otti tippen: er winkt.
  buehne.addEventListener('click', function () {
    if (!frei) { freischalten(); setTimeout(function () { zustand = ''; zeige('winkt'); }, 300); }
    else { zustand = ''; zeige('winkt'); }
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>

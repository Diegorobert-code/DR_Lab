<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ava</title>
<meta name="theme-color" content="#0d1638">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { --nacht:#0d1638; --nacht2:#22306e; --gold:#f5c542; --rosa:#ff9ec4; --rosa2:#ffd1e3; --text:#fbf6ec; --leise:#c3c9e6; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; min-height:100%; }
  body { background:radial-gradient(120% 70% at 50% 0%, var(--nacht2), var(--nacht) 72%); color:var(--text);
    font:17px/1.4 system-ui, -apple-system, sans-serif; display:flex; flex-direction:column; align-items:center;
    padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 24px); overflow-x:hidden; }
  .sterne { position:fixed; inset:0; pointer-events:none; z-index:0; }
  .sterne i { position:absolute; width:3px; height:3px; border-radius:50%; background:#fff; opacity:.7; animation:blink 3s ease-in-out infinite; }
  @keyframes blink { 50% { opacity:.15; transform:scale(.6); } }
  .mond { position:fixed; top:calc(env(safe-area-inset-top) + 18px); right:22px; width:54px; height:54px; border-radius:50%;
    box-shadow:-12px 6px 0 0 #ffe9a8; transform:rotate(-20deg); opacity:.9; pointer-events:none; }
  main { position:relative; z-index:1; width:min(100%, 460px); display:flex; flex-direction:column; align-items:center; }
  h1 { margin:2px 0 0; font-size:44px; letter-spacing:1px; color:var(--rosa2); text-shadow:0 0 18px #ff9ec488; font-family:ui-rounded, "SF Pro Rounded", system-ui, sans-serif; }
  .unter { color:var(--leise); margin:0 0 14px; text-align:center; }
  .held { position:relative; width:min(84vw, 360px); aspect-ratio:1/1; border-radius:50%; overflow:visible; cursor:pointer; }
  .held img { width:100%; height:100%; object-fit:cover; border-radius:50%; display:block;
    box-shadow:0 0 0 5px #ffffff22, 0 0 0 10px #ff9ec433, 0 20px 60px #0009, 0 0 70px #ff9ec455; }
  .held.atmet img { animation:atmen 3.8s ease-in-out infinite; }
  @keyframes atmen { 50% { transform:scale(1.02) translateY(-3px); } }
  .held.hops img { animation:hops .6s cubic-bezier(.3,1.6,.5,1); }
  @keyframes hops { 35% { transform:translateY(-18px) scale(1.06); } 70% { transform:translateY(2px); } }
  .blase { position:absolute; left:50%; bottom:-6px; transform:translate(-50%, 100%); width:max-content; max-width:88vw;
    background:var(--text); color:#2a2233; padding:10px 16px; border-radius:20px; font-size:16px; box-shadow:0 8px 24px #0006;
    opacity:0; transition:opacity .3s; pointer-events:none; text-align:center; }
  .blase.an { opacity:1; }
  .funke { position:fixed; width:12px; height:12px; border-radius:50%; pointer-events:none; z-index:5;
    background:radial-gradient(#fff, var(--gold) 55%, transparent 70%); animation:funke 1s ease-out forwards; }
  @keyframes funke { to { transform:translate(var(--dx), var(--dy)) scale(.2); opacity:0; } }
  .knoepfe { display:grid; grid-template-columns:repeat(2, 1fr); gap:20px 26px; margin-top:64px; }
  .knopf { display:flex; flex-direction:column; align-items:center; gap:8px; text-decoration:none; color:var(--text);
    background:none; border:0; font:inherit; cursor:pointer; padding:0; }
  .knopf b { width:104px; height:104px; border-radius:50%; display:grid; place-items:center; font-size:46px;
    box-shadow:0 10px 28px #0008, inset 0 -6px 0 #0002, inset 0 4px 0 #fff5; transition:transform .12s; }
  .knopf:active b { transform:scale(.92); }
  .knopf:focus-visible b { outline:3px solid #fff; outline-offset:4px; }
  .knopf span { font-weight:600; font-size:16px; }
  .k1 b { background:linear-gradient(#ffb3d1, #ff7fb0); }
  .k2 b { background:linear-gradient(#ffe27a, #f5b81f); }
  .k3 b { background:linear-gradient(#ff8a7a, #e0303f); }
  .k4 b { background:linear-gradient(#bfe6ff, #6fb8f0); }
  .freunde { margin-top:34px; width:100%; background:#ffffff10; border-radius:26px; padding:16px; text-align:center; }
  .freunde h2 { margin:0 0 10px; font-size:18px; color:var(--gold); }
  .reihe { display:flex; justify-content:center; gap:18px; }
  .freund { display:flex; flex-direction:column; align-items:center; gap:6px; font-size:14px; color:var(--leise); background:none; border:0; cursor:pointer; font-family:inherit; }
  .freund i { width:64px; height:64px; border-radius:50%; display:grid; place-items:center; font-size:34px; font-style:normal; box-shadow:0 6px 16px #0007; }
  .minky i { background:linear-gradient(135deg, #ffc4dc, #fff1a8); }
  .minka i { background:linear-gradient(135deg, #b9e3ff, #d9c3ff); }
  .waef i { background:#fff; }
  .freund.hops i { animation:hops .6s cubic-bezier(.3,1.6,.5,1); }
  /* Bilderbuch */
  .buch { position:fixed; inset:0; z-index:10; background:#070c22; display:none; flex-direction:column; align-items:center; justify-content:center;
    padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px); }
  .buch.an { display:flex; }
  .buch figure { margin:0; width:min(92vw, 480px, 62vh); }
  .buch img { width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:26px; box-shadow:0 20px 60px #000a; display:block; animation:ein .5s ease; }
  @keyframes ein { from { opacity:0; transform:scale(.97); } }
  .buch figcaption { margin-top:14px; font-size:19px; line-height:1.45; text-align:center; min-height:84px; }
  .buch .seite { color:var(--leise); font-size:14px; margin-top:4px; }
  .buch nav { display:flex; gap:22px; margin-top:14px; }
  .rund { width:76px; height:76px; border-radius:50%; border:0; font-size:32px; cursor:pointer; display:grid; place-items:center;
    background:var(--gold); color:#2a1d00; box-shadow:0 10px 26px #0008; }
  .rund.leise { background:#ffffff22; color:var(--text); }
  .rund.an { background:var(--rosa); color:#3a0f22; }
  .rund:active { transform:scale(.93); }
  .zu { position:absolute; top:calc(env(safe-area-inset-top) + 10px); right:14px; width:52px; height:52px; font-size:26px; }
  .hinweis { color:var(--leise); font-size:13px; margin-top:26px; text-align:center; }
  @media (prefers-reduced-motion: reduce) { .held.atmet img, .sterne i { animation:none; } }
</style>
</head>
<body>
<div class="sterne" id="sterne"></div>
<div class="mond"></div>
<main>
  <h1>Ava</h1>
  <p class="unter">mit Wäf Wäf, Minky und Minka</p>

  <div class="held atmet" id="held" role="button" tabindex="0" aria-label="Ava antippen">
    <img src="ava.jpg" alt="Ava, ein kleines Mädchen mit blonden Haaren im rosa Pyjama">
    <div class="blase" id="blase"></div>
  </div>

  <div class="knoepfe">
    <a class="knopf k1" href="../nova/reden.html?f=ava"><b>🎙</b><span>Mit Ava reden</span></a>
    <button class="knopf k2" id="buchAuf" type="button"><b>📖</b><span>Ava trifft Otti</span></button>
    <a class="knopf k3" href="../nova/reden.html?f=carmencita"><b>💃</b><span>Carmencita</span></a>
    <a class="knopf k4" href="../waefwaef/"><b>🐶</b><span>Wäf Wäf</span></a>
  </div>

  <section class="freunde" aria-label="Avas Freunde">
    <h2>Avas kleine Freunde</h2>
    <div class="reihe">
      <button class="freund minky" type="button" data-satz="Minky ist rosa und gelb und ganz, ganz weich."><i>🐰</i>Minky</button>
      <button class="freund waef" type="button" data-satz="Wäf! Wäf! Das ist mein Hund. Er ist so weiss wie Schnee."><i>🐶</i>Wäf Wäf</button>
      <button class="freund minka" type="button" data-satz="Minka ist hellblau, wie der Himmel am Morgen."><i>🐰</i>Minka</button>
    </div>
  </section>
  <p class="hinweis">Tipp auf Ava, dann sagt sie etwas.</p>
</main>

<div class="buch" id="buch" role="dialog" aria-label="Bilderbuch: Ava trifft Otti">
  <button class="rund leise zu" id="buchZu" type="button" aria-label="Schliessen">✕</button>
  <figure><img id="bBild" alt=""><figcaption id="bText"></figcaption><div class="seite" id="bSeite"></div></figure>
  <nav>
    <button class="rund leise" id="zurueck" type="button" aria-label="Zurück">◀</button>
    <button class="rund leise" id="vorlesen" type="button" aria-label="Vorlesen">🔊</button>
    <button class="rund" id="weiter" type="button" aria-label="Weiter">▶</button>
  </nav>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var ruhig = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Sternenhimmel
  for (var i = 0; i < 46; i++) {
    var s = document.createElement('i');
    s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 3).toFixed(2) + 's';
    if (Math.random() < .3) { s.style.width = s.style.height = '2px'; }
    $('sterne').appendChild(s);
  }

  // Vorlesen mit der Stimme des Geräts (gratis, bleibt auf dem Handy)
  function stimme() {
    var v = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
    return v.find(function (x) { return /^de/i.test(x.lang) && /anna|petra|helena|female|frau/i.test(x.name); }) ||
           v.find(function (x) { return /^de/i.test(x.lang); });
  }
  function sag(t, hoch) {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(t); u.lang = 'de-DE'; u.rate = .95; u.pitch = hoch || 1.35;
    var v = stimme(); if (v) u.voice = v;
    speechSynthesis.speak(u);
  }
  function funken(x, y) {
    if (ruhig) return;
    for (var i = 0; i < 12; i++) {
      var f = document.createElement('div'); f.className = 'funke';
      f.style.left = x + 'px'; f.style.top = y + 'px';
      var w = Math.random() * Math.PI * 2, r = 50 + Math.random() * 70;
      f.style.setProperty('--dx', Math.cos(w) * r + 'px'); f.style.setProperty('--dy', Math.sin(w) * r + 'px');
      document.body.appendChild(f); setTimeout(f.remove.bind(f), 1000);
    }
  }

  // Ava antippen
  var SAETZE = ['Hallo! Schön, dass du da bist.', 'Weisst du was? Otti hat mir die goldene Lichtspur gezeigt.',
    'Wäf Wäf will spielen! Spielst du mit?', 'Im Kino gibt es einen grossen roten Vorhang.',
    'Minky und Minka sind ganz klein, aber sehr mutig.', 'Tipp auf das Mikrofon, dann können wir richtig reden.',
    'Carmencita tanzt so schön. Uno, dos, tres!', 'Wenn ich nicht schlafen kann, schaue ich zu den Sternen.'];
  var letzt = -1, blaseTimer;
  function zeige(t) {
    var b = $('blase'); b.textContent = t; b.classList.add('an');
    clearTimeout(blaseTimer); blaseTimer = setTimeout(function () { b.classList.remove('an'); }, 4200);
  }
  function tippAva(e) {
    var h = $('held'); h.classList.remove('atmet', 'hops'); void h.offsetWidth; h.classList.add('hops');
    setTimeout(function () { h.classList.remove('hops'); h.classList.add('atmet'); }, 650);
    var i; do { i = Math.floor(Math.random() * SAETZE.length); } while (i === letzt); letzt = i;
    zeige(SAETZE[i]); sag(SAETZE[i]);
    var r = h.getBoundingClientRect(); funken(e && e.clientX ? e.clientX : r.left + r.width / 2, e && e.clientY ? e.clientY : r.top + r.height / 2);
  }
  $('held').addEventListener('click', tippAva);
  $('held').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tippAva(); } });

  document.querySelectorAll('.freund').forEach(function (b) {
    b.addEventListener('click', function (e) {
      b.classList.remove('hops'); void b.offsetWidth; b.classList.add('hops');
      zeige(b.dataset.satz); sag(b.dataset.satz); funken(e.clientX, e.clientY);
    });
  });

  // Bilderbuch «Ava trifft Otti» (Bilder von Tinko)
  var SEITEN = [
    'Es ist schon spät. Ava liegt im Bett, aber sie ist noch hellwach. Sie kann einfach nicht schlafen.',
    'Da leuchtet etwas draussen vor dem Fenster. Was kann das sein?',
    'Ein kleiner Igel mit gelbem Halstuch winkt ihr zu. Das ist Otti! Er zeigt auf eine goldene Lichtspur.',
    'Zusammen rutschen sie auf dem Lichtweg hinunter, mitten hinein in eine Zauberwelt.',
    'Dort leuchten tausend Lichter. Und überall wohnen Freunde.',
    'Es gibt sogar ein Kino, mit einem grossen roten Vorhang.',
    'Nova und ihre Freunde winken Hallo. Ava winkt zurück.',
    'Otti gähnt ganz laut. Hier sind alle deine Freunde, flüstert er. Und jetzt geht es heim.',
    'Zurück im warmen Bett leuchtet der kleine Stern weiter. Und Ava schläft ein. Gute Nacht.'
  ];
  var seite = 0, liest = false;
  function zeigeSeite() {
    var img = $('bBild'); img.src = 'bilder/s' + (seite + 1) + '.jpg';
    img.style.animation = 'none'; void img.offsetWidth; img.style.animation = '';
    $('bText').textContent = SEITEN[seite];
    $('bSeite').textContent = (seite + 1) + ' von ' + SEITEN.length;
    $('zurueck').style.visibility = seite ? 'visible' : 'hidden';
    $('weiter').textContent = seite === SEITEN.length - 1 ? '★' : '▶';
    if (liest) sag(SEITEN[seite], 1.05);
  }
  $('buchAuf').addEventListener('click', function () { seite = 0; $('buch').classList.add('an'); zeigeSeite(); });
  $('buchZu').addEventListener('click', function () { $('buch').classList.remove('an'); if (window.speechSynthesis) speechSynthesis.cancel(); });
  $('zurueck').addEventListener('click', function () { if (seite > 0) { seite--; zeigeSeite(); } });
  $('weiter').addEventListener('click', function () {
    if (seite < SEITEN.length - 1) { seite++; zeigeSeite(); }
    else { $('buch').classList.remove('an'); if (window.speechSynthesis) speechSynthesis.cancel(); zeige('Gute Nacht, kleine Sternenfreundin!'); }
  });
  $('vorlesen').addEventListener('click', function () {
    liest = !liest; $('vorlesen').classList.toggle('an', liest);
    if (liest) sag(SEITEN[seite], 1.05); else if (window.speechSynthesis) speechSynthesis.cancel();
  });
  // Wischen im Bilderbuch
  var x0 = null;
  $('buch').addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  $('buch').addEventListener('touchend', function (e) {
    if (x0 === null) return; var d = e.changedTouches[0].clientX - x0; x0 = null;
    if (d < -50) $('weiter').click(); else if (d > 50 && seite > 0) $('zurueck').click();
  });
  for (var p = 1; p <= SEITEN.length; p++) { var vor = new Image(); vor.src = 'bilder/s' + p + '.jpg'; }
})();
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-label="Granny">
  <defs>
    <radialGradient id="gSkin" cx="45%" cy="40%" r="65%"><stop offset="0" stop-color="#ffe3cf"/><stop offset="1" stop-color="#f0b996"/></radialGradient>
    <radialGradient id="gHair" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="#f4f4f2"/><stop offset="1" stop-color="#b9b9b4"/></radialGradient>
    <linearGradient id="gBlouse" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe9ea"/><stop offset="1" stop-color="#f0cfd3"/></linearGradient>
    <radialGradient id="gGold" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff2b0"/><stop offset=".55" stop-color="#f2c14e"/><stop offset="1" stop-color="#b9851c"/></radialGradient>
    <radialGradient id="gRose" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ff5a6a"/><stop offset="1" stop-color="#a50f22"/></radialGradient>
  </defs>
  <!-- Bluse, geblümt -->
  <path d="M58 340 C58 262 92 228 150 228 C208 228 242 262 242 340 Z" fill="url(#gBlouse)"/>
  <g fill="#c94a5c" opacity=".75">
    <circle cx="92" cy="300" r="7"/><circle cx="118" cy="324" r="6"/><circle cx="196" cy="316" r="7"/><circle cx="214" cy="282" r="5"/><circle cx="104" cy="266" r="5"/><circle cx="176" cy="290" r="5"/><circle cx="226" cy="330" r="5"/><circle cx="80" cy="330" r="5"/>
  </g>
  <g fill="#e48a98" opacity=".7"><circle cx="134" cy="296" r="4"/><circle cx="166" cy="320" r="4"/><circle cx="200" cy="256" r="4"/><circle cx="100" cy="286" r="3"/></g>
  <path d="M150 232 L150 340" stroke="#d9a9b0" stroke-width="2"/>
  <circle cx="150" cy="282" r="3.5" fill="#fff"/><circle cx="150" cy="306" r="3.5" fill="#fff"/><circle cx="150" cy="330" r="3.5" fill="#fff"/>
  <path d="M126 232 C134 246 166 246 174 232" fill="#f3c2a1"/>
  <!-- rote Rose = Sprechknopf -->
  <g transform="translate(112 258)">
    <path d="M-4 10 L-14 30" stroke="#3f8a3a" stroke-width="3"/><ellipse cx="-14" cy="22" rx="8" ry="4" fill="#4fa046" transform="rotate(-30 -14 22)"/>
    <circle r="14" fill="url(#gRose)"/>
    <path d="M-7 -2 a7 7 0 0 1 14 0 a5 5 0 0 1 -9 3 a3 3 0 0 1 5 -2" fill="none" stroke="#7a0a18" stroke-width="1.8"/>
  </g>
  <!-- Zettel «Brille?» -->
  <g transform="rotate(-8 205 290)"><rect x="186" y="272" width="40" height="34" rx="3" fill="#ffe680"/><text x="206" y="294" font-family="Georgia,serif" font-size="10" text-anchor="middle" fill="#6b4b00">Brille?</text></g>
  <!-- Lockige graue Haare (Wolke) -->
  <g fill="url(#gHair)">
    <circle cx="150" cy="70" r="46"/><circle cx="104" cy="88" r="38"/><circle cx="196" cy="88" r="38"/>
    <circle cx="80" cy="128" r="32"/><circle cx="220" cy="128" r="32"/><circle cx="78" cy="168" r="26"/><circle cx="222" cy="168" r="26"/>
    <circle cx="124" cy="52" r="26"/><circle cx="178" cy="52" r="26"/><circle cx="236" cy="104" r="20"/><circle cx="64" cy="104" r="20"/>
  </g>
  <!-- Ohren + Ohrringe -->
  <circle cx="80" cy="160" r="5" fill="url(#gGold)"/><circle cx="220" cy="160" r="5" fill="url(#gGold)"/>
  <!-- Gesicht -->
  <ellipse cx="150" cy="152" rx="66" ry="72" fill="url(#gSkin)"/>
  <!-- Stirnlocken -->
  <g fill="url(#gHair)"><circle cx="112" cy="96" r="18"/><circle cx="138" cy="88" r="17"/><circle cx="164" cy="88" r="17"/><circle cx="190" cy="96" r="18"/></g>
  <!-- rote Brille hochgeschoben in die Locken (sie sucht sie) -->
  <g fill="rgba(255,255,255,.3)" stroke="#b8232f" stroke-width="5">
    <rect x="102" y="76" width="38" height="26" rx="8"/><rect x="160" y="76" width="38" height="26" rx="8"/>
  </g>
  <path d="M140 88 Q150 82 160 88" stroke="#b8232f" stroke-width="4" fill="none"/>
  <!-- Augenbrauen -->
  <path d="M112 128 Q124 120 136 127" stroke="#a9a9a4" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M164 127 Q176 120 188 128" stroke="#a9a9a4" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Augen, lachend zugekniffen -->
  <path d="M112 148 Q124 138 136 148" stroke="#2a2140" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M164 148 Q176 138 188 148" stroke="#2a2140" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M106 156 Q112 162 118 158 M194 156 Q188 162 182 158" stroke="#d99a7c" stroke-width="2" fill="none"/>
  <!-- Wangen -->
  <ellipse cx="106" cy="174" rx="15" ry="10" fill="#ff9d9d" opacity=".55"/><ellipse cx="194" cy="174" rx="15" ry="10" fill="#ff9d9d" opacity=".55"/>
  <!-- Nase -->
  <ellipse cx="150" cy="166" rx="9" ry="8" fill="#eaa98a"/>
  <!-- Mund, grosses Lachen, rote Lippen -->
  <path d="M124 186 Q150 214 176 186 Z" fill="#b2404f" stroke="#8b2a3a" stroke-width="2"/>
  <path d="M131 189 Q150 199 169 189" fill="#fff"/>
</svg>

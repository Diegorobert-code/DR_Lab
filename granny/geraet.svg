<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <radialGradient id="gold" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff2b0"/><stop offset=".55" stop-color="#f2c14e"/><stop offset="1" stop-color="#b9851c"/></radialGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe9ea"/><stop offset="1" stop-color="#e9c3c9"/></linearGradient><radialGradient id="rose" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ff5a6a"/><stop offset="1" stop-color="#a50f22"/></radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe08a" stop-opacity=".9"/><stop offset="1" stop-color="#ffe08a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="900" height="620" fill="#0b1230"/>
  <text x="30" y="46" fill="#ffe08a" font-size="26" font-weight="700">Granny-Figur · Geräte-Entwurf v0.2</text>
  <text x="30" y="72" fill="#c9d2ee" font-size="15">Intern, nicht veröffentlichen · DR Lab · 15.10.2026 · Höhe ca. 15 cm, Fuss Ø 10 cm</text>
  <!-- Lichtring Glow -->
  <ellipse cx="300" cy="545" rx="150" ry="26" fill="url(#glow)"/>
  <!-- Sockel -->
  <ellipse cx="300" cy="540" rx="120" ry="22" fill="#1c2a5c" stroke="#f2c14e" stroke-width="5"/>
  <!-- Rock/Körper mit Lautsprecher -->
  <path d="M190 535 C190 420 220 340 300 340 C380 340 410 420 410 535 Z" fill="url(#coat)"/>
  <g fill="#c94a5c" opacity=".6"><circle cx="225" cy="440" r="7"/><circle cx="378" cy="455" r="7"/><circle cx="240" cy="515" r="6"/><circle cx="365" cy="515" r="6"/><circle cx="350" cy="380" r="5"/></g>
  <g fill="#7a3a46">
    <circle cx="270" cy="470" r="4"/><circle cx="285" cy="470" r="4"/><circle cx="300" cy="470" r="4"/><circle cx="315" cy="470" r="4"/><circle cx="330" cy="470" r="4"/>
    <circle cx="263" cy="485" r="4"/><circle cx="278" cy="485" r="4"/><circle cx="293" cy="485" r="4"/><circle cx="308" cy="485" r="4"/><circle cx="323" cy="485" r="4"/><circle cx="338" cy="485" r="4"/>
    <circle cx="270" cy="500" r="4"/><circle cx="285" cy="500" r="4"/><circle cx="300" cy="500" r="4"/><circle cx="315" cy="500" r="4"/><circle cx="330" cy="500" r="4"/>
  </g>
  <path d="M262 352 C276 372 324 372 338 352 C326 344 274 344 262 352 Z" fill="#fff7ee"/>
  <!-- Brosche = Sprechknopf -->
  <path d="M282 428 L268 452" stroke="#3f8a3a" stroke-width="4"/><ellipse cx="270" cy="440" rx="11" ry="5" fill="#4fa046" transform="rotate(-30 270 440)"/><circle cx="300" cy="400" r="36" fill="url(#rose)" stroke="#7a0a18" stroke-width="3"/>
  <path d="M300 384 a9 9 0 0 1 9 9 v10 a9 9 0 0 1 -18 0 v-10 a9 9 0 0 1 9 -9 z M284 404 a16 16 0 0 0 32 0" fill="none" stroke="#ffd6db" stroke-width="3"/>
  <!-- Kopf -->
  <g fill="#d6d6d2"><circle cx="300" cy="200" r="48"/><circle cx="252" cy="220" r="40"/><circle cx="348" cy="220" r="40"/><circle cx="226" cy="262" r="34"/><circle cx="374" cy="262" r="34"/><circle cx="230" cy="306" r="28"/><circle cx="370" cy="306" r="28"/><circle cx="272" cy="180" r="28"/><circle cx="328" cy="180" r="28"/></g>
  <ellipse cx="300" cy="278" rx="72" ry="70" fill="#f6cfb3"/>
  <!-- Display-Gesicht -->
  <circle cx="300" cy="285" r="52" fill="#101a3d" stroke="#f2c14e" stroke-width="3"/>
  <ellipse cx="283" cy="280" rx="8" ry="10" fill="#ffe08a"/><ellipse cx="317" cy="280" rx="8" ry="10" fill="#ffe08a"/>
  <path d="M284 302 Q300 316 316 302" stroke="#ffe08a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <g fill="none" stroke="#b8232f" stroke-width="5"><rect x="256" y="200" width="36" height="24" rx="7"/><rect x="308" y="200" width="36" height="24" rx="7"/><path d="M292 211 Q300 205 308 211"/></g>
  <!-- Beschriftungen -->
  <g fill="#fffaf0" font-size="15">
    <line x1="352" y1="285" x2="520" y2="150" stroke="#f2c14e"/><text x="528" y="140" font-weight="700" fill="#ffe08a">1 Rundes Display = Grannys Gesicht</text><text x="528" y="160">lächelt, nickt, zeigt «Nachricht von Diego»</text>
    <line x1="336" y1="400" x2="520" y2="230" stroke="#f2c14e"/><text x="528" y="220" font-weight="700" fill="#ffe08a">2 Rote Rose = EIN Knopf</text><text x="528" y="240">drücken und reden · Nachricht anhören</text>
    <line x1="346" y1="485" x2="520" y2="310" stroke="#f2c14e"/><text x="528" y="300" font-weight="700" fill="#ffe08a">3 Lautsprecher in der Bluse</text><text x="528" y="320">sehr laut, tiefe klare Stimme, gut für Hörgeräte</text>
    <line x1="420" y1="540" x2="520" y2="390" stroke="#f2c14e"/><text x="528" y="380" font-weight="700" fill="#ffe08a">4 Lichtring im Sockel</text><text x="528" y="400">blinkt bei neuer Nachricht (wer nicht hört, sieht)</text>
    <text x="528" y="460" font-weight="700" fill="#ffe08a">5 Innen</text><text x="528" y="480">ESP32-S3 mit Mikrofon (wie Nova) · WLAN</text><text x="528" y="500">später eigene SIM: kein Koppeln mit Handy nötig</text>
    <text x="528" y="540" font-weight="700" fill="#ffe08a">6 Kein Passwort, kein Menü</text><text x="528" y="560">Familie richtet per App ein · Ladeschale statt Kabel</text>
  </g>
</svg>

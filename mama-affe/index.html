<style>
:root{
  --bg:#10183a; --bg2:#1c1f4a; --card:#232a5c; --card2:#2b336b; --line:#3a4380;
  --ink:#f5f1e8; --muted:#b9bcd9; --gold:#e8be5c; --gold2:#f5d68a; --coral:#ff8a6b;
  --green:#7fd1a0; --red:#ff6b6b; --sky:#8fc7ff;
  --r:18px; --font: ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#10183a}
html,body{margin:0;color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5}
body{background:linear-gradient(180deg,#10183a 0%,#1c1f4a 60%,#241e46 100%) fixed;min-height:100vh}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}

.iconbtn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;min-width:44px;height:44px;font-size:1.2rem;cursor:pointer}
h1{font-family:Georgia,serif;color:var(--gold);font-size:1.7rem;margin:8px 0 4px}

h3{font-size:1.05rem;margin:12px 0 4px}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card.gold{border-color:var(--gold)}
.card.soft{background:rgba(255,255,255,.04)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 10px;text-align:center;cursor:pointer;color:var(--ink);font:inherit;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tile:active{transform:scale(.97)}
.tile .e{font-size:2rem;line-height:1}
.tile .l{font-weight:600;font-size:.95rem}
.tile.sel{border-color:var(--gold);background:var(--card2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--gold);color:#1a1530;border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;min-height:48px}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.compass{display:inline-flex;align-items:center;gap:6px;color:var(--gold);font-size:.85rem;border:1px solid var(--gold);border-radius:999px;padding:4px 10px}

textarea,input[type=text],input[type=date],select{width:100%;background:#151c45;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}

.help a{color:var(--gold2)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(16,24,58,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}

.foot{margin-top:28px;font-size:.8rem;color:var(--muted);text-align:center}
.check{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--card2);margin:8px 0;cursor:pointer;border:2px solid transparent}
.check.done{border-color:var(--green);opacity:.75}

.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#1a1530;padding:10px 18px;border-radius:999px;font-weight:700;z-index:9;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.pause{position:fixed;inset:0;background:rgba(10,14,36,.97);z-index:8;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pause .card{max-width:480px;width:100%;margin:auto 0;animation:pop .4s cubic-bezier(.2,1.4,.4,1) both}
.hide{display:none!important}
.hold{position:relative;overflow:hidden}
.hold .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--gold);width:0}

/* ---------- Welt: Nachthimmel, Städtchen, Figur, Effekte (19.10.) ---------- */
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#sky .st{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff8e0;animation:tw 3s ease-in-out infinite}
#sky .moon{position:absolute;top:92px;right:18px;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 38% 38%,#fff6d8,#f2d893 60%,#d9b65e);box-shadow:0 0 40px 12px rgba(245,214,138,.28);animation:moon 9s ease-in-out infinite}
#sky .moon:after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:rgba(200,160,80,.35);top:32px;left:18px;box-shadow:16px -12px 0 -3px rgba(200,160,80,.3)}
#sky .shoot{position:absolute;top:12%;left:-10%;width:110px;height:2px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff);border-radius:2px;transform:rotate(-18deg);opacity:0;animation:shoot 11s linear infinite 3s}
#sky svg.town{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;max-height:34vh;opacity:.55}
#sky .lamp{animation:glow 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
@keyframes moon{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(-18deg)}2%{opacity:1}9%{opacity:0;transform:translate(130vw,-30vh) rotate(-18deg)}100%{opacity:0}}
@keyframes glow{0%,100%{opacity:.75}50%{opacity:1}}
.fig{display:block;margin:0 auto;overflow:visible;filter:drop-shadow(0 12px 22px rgba(0,0,0,.35))}
.fig .bodyg{transform-origin:100px 210px;animation:sway 4.2s ease-in-out infinite}
.fig .armw{transform-origin:62px 140px;animation:wave 1.8s ease-in-out infinite}
.fig.cheer .arml{transform-origin:62px 140px;animation:cheerL .7s ease-in-out infinite alternate}
.fig.cheer .armr{transform-origin:138px 140px;animation:cheerR .7s ease-in-out infinite alternate}
.fig.cheer .bodyg{animation:hop .7s ease-in-out infinite alternate}
.fig .lid{transform-box:fill-box;transform-origin:center top;animation:blink 5s infinite}
.fig .needle{transform-box:fill-box;transform-origin:center;animation:needle 3.5s ease-in-out infinite}
.fig .tuft{transform-box:fill-box;transform-origin:center bottom;animation:tuft 2.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg)}}
@keyframes cheerL{from{transform:rotate(10deg)}to{transform:rotate(-12deg)}}
@keyframes cheerR{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-8px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}95.5%{transform:scaleY(1)}}
@keyframes needle{0%,100%{transform:rotate(-25deg)}50%{transform:rotate(30deg)}}
@keyframes tuft{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.hero .fig{width:min(58vw,230px);height:auto}
header.top .fig{width:48px;height:48px;filter:none;background:radial-gradient(circle,#2f3a7a,#1c2350);border:2px solid var(--gold);border-radius:14px;padding:2px}
.bubble{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(6px)}to{opacity:1;transform:none}}
.grid>*,.grid3>*{animation:up .4s ease both}
.grid>*:nth-child(2),.grid3>*:nth-child(2){animation-delay:.05s}.grid>*:nth-child(3),.grid3>*:nth-child(3){animation-delay:.1s}
.grid>*:nth-child(4){animation-delay:.15s}.grid>*:nth-child(5){animation-delay:.2s}.grid>*:nth-child(6){animation-delay:.25s}
.grid>*:nth-child(n+7){animation-delay:.3s}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.tile{position:relative;overflow:hidden;transition:transform .15s,box-shadow .2s;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.tile:before{content:"";position:absolute;inset:0;opacity:.55;pointer-events:none;background:var(--tg,linear-gradient(160deg,rgba(143,199,255,.18),transparent 60%))}
.grid .tile:nth-child(6n+1){--tg:linear-gradient(160deg,rgba(255,138,107,.28),transparent 65%)}
.grid .tile:nth-child(6n+2){--tg:linear-gradient(160deg,rgba(232,190,92,.28),transparent 65%)}
.grid .tile:nth-child(6n+3){--tg:linear-gradient(160deg,rgba(127,209,160,.26),transparent 65%)}
.grid .tile:nth-child(6n+4){--tg:linear-gradient(160deg,rgba(143,199,255,.28),transparent 65%)}
.grid .tile:nth-child(6n+5){--tg:linear-gradient(160deg,rgba(214,150,255,.26),transparent 65%)}
.grid .tile:nth-child(6n){--tg:linear-gradient(160deg,rgba(255,170,200,.24),transparent 65%)}
.tile>*{position:relative}
.tile .e{transition:transform .25s;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.tile:hover .e,.tile:active .e{transform:scale(1.18) rotate(-6deg)}
.tile:active{transform:scale(.95)}
.btn{transition:transform .12s, filter .2s;box-shadow:0 6px 16px rgba(0,0,0,.22)}
.btn:active{transform:scale(.96)}
.btn:not(.alt):not(.red){background:linear-gradient(180deg,var(--gold2),var(--gold))}
.answers button{transition:transform .12s}
.answers button:active{transform:scale(.94)}
.answers button.ok{animation:okpop .5s ease}
.answers button.no{animation:shake .4s ease}
@keyframes okpop{40%{transform:scale(1.12)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.burst{position:fixed;z-index:20;pointer-events:none;font-size:1.5rem;left:0;top:0;animation:fly 1s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes fly{0%{transform:translate(var(--x0),var(--y0)) scale(.4);opacity:1}100%{transform:translate(var(--x1),var(--y1)) scale(1.1) rotate(var(--r));opacity:0}}
#intro{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#2a2f6e,#10183a 70%);transition:opacity .6s;cursor:pointer;overflow:hidden}
#intro.out{opacity:0;pointer-events:none}
#intro .vine{position:absolute;top:0;left:50%;width:170px;margin-left:-85px;transform-origin:50% 0;animation:swing 2.4s cubic-bezier(.3,.6,.3,1) both}
#intro .vine .rope{width:6px;height:28vh;margin:0 auto;background:repeating-linear-gradient(180deg,#5f8b3a 0 14px,#4b7430 14px 20px);border-radius:3px}
#intro .vine .leaf{position:absolute;font-size:1.4rem}
#intro .vine .fig{width:170px;height:auto;margin-top:-30px}
@keyframes swing{0%{transform:rotate(-70deg)}35%{transform:rotate(28deg)}60%{transform:rotate(-12deg)}80%{transform:rotate(5deg)}100%{transform:rotate(0)}}
#intro .name{position:absolute;bottom:22vh;font-family:Georgia,serif;font-size:2.6rem;color:var(--gold);text-shadow:0 4px 24px rgba(232,190,92,.45);display:flex;gap:2px}
#intro .name span{display:inline-block;animation:letter .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes letter{from{opacity:0;transform:translateY(30px) scale(.5)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion: reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

<body>
<div id="sky" aria-hidden="true"></div>
<div class="wrap" id="app"></div>
<nav class="tabs hide" id="tabs"><div class="in" id="tabsIn"></div></nav>
<div class="toast" id="toast"></div>
<script>
/* Mama Affe – erste nutzbare Version (17.10.2026)
   Alles bleibt auf dem Gerät (localStorage). Keine Konten, keine Server.
   Rote Linie: keine Diagnose, keine Therapie, Wegweiserin zu Fachpersonen. */
const $ = s => document.querySelector(s);
const app = $('#app');
const ICON = 'icon-512.png';
const store = {
  get(k, d){ try{ const v = localStorage.getItem('mamaaffe.'+k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('mamaaffe.'+k, JSON.stringify(v)); }catch(e){} }
};
let state = {
  age: store.get('age', '6-12'),
  voice: store.get('voice', true),
  mood: null, kidName: store.get('kidName', '')
};
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('on'),1800); }

/* ---------- Stimme (Abstimmung mit Nova-Thread folgt) ---------- */
let VOICE = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  VOICE = vs.find(v=>/de-CH/i.test(v.lang)) || vs.find(v=>/de/i.test(v.lang) && /Anna|Petra|Helena|Marlene|female/i.test(v.name)) || vs.find(v=>/^de/i.test(v.lang)) || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(t){
  if(!state.voice || !('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); if(VOICE) u.voice = VOICE; u.lang = VOICE ? VOICE.lang : 'de-CH'; u.rate = .95; u.pitch = 1.1; speechSynthesis.speak(u); }catch(e){}
}
function stopSay(){ try{ speechSynthesis.cancel(); }catch(e){} }

/* ---------- Daten ---------- */
const AGES = [
  {k:'1-3', l:'1–3 J.'}, {k:'3-6', l:'3–6 J.'}, {k:'6-12', l:'6–12 J.'}, {k:'12-16', l:'12–16 J.'}
];
const HELP = [
  {n:'Pro Juventute (für Kinder und Jugendliche)', t:'147', d:'Gratis, rund um die Uhr, auch Chat auf 147.ch'},
  {n:'Elternnotruf', t:'0848 35 45 55', d:'Rund um die Uhr, für Eltern unter Druck'},
  {n:'Sanitätsnotruf', t:'144', d:'Bei Lebensgefahr, Verletzung, akuter Krise'},
  {n:'Tox Info Suisse', t:'145', d:'Wenn etwas verschluckt oder getrunken wurde'},
  {n:'Dargebotene Hand (für dich)', t:'143', d:'Wenn du selbst jemanden zum Reden brauchst'}
];
/* «Was ist heute los?» – Inhalte nach Forschung (zweistein/mama-aff-forschung.md) */
const SITUATIONS = [
 {id:'wut', e:'🌋', l:'Wutanfall',
  behind:'Wut ist ein Gefühl, das zu gross für den kleinen Körper ist. Oft stecken Müdigkeit, Hunger, ein Übergang (aufhören, losgehen) oder ein Nein dahinter.',
  normal:{'1-3':'Mit 1–3 Jahren sind Wutanfälle sehr häufig. Das Hirn für Bremsen reift erst langsam.','3-6':'Mit 3–6 werden sie seltener, kommen aber bei Müdigkeit zurück. Worte für Gefühle helfen jetzt viel.','6-12':'Im Schulalter zeigt sich Wut oft nach einem langen Tag. Das Kind hat sich in der Schule zusammengerissen.','12-16':'Bei Jugendlichen gehört Reizbarkeit oft zur Entwicklung. Wichtig ist, dass die Beziehung hält.'},
  try:'Erst ruhig werden, dann reden: «Du bist ganz wütend. Ich bleibe da.» Wenig Worte, tief ausatmen, später über die Grenze sprechen.',
  body:'Gemeinsam schwer werden wie ein Bär, Füsse in den Boden drücken, lang ausatmen.',
  when:'Wenn Wut oft mit Verletzungen endet, über Wochen sehr häufig ist oder du selbst nicht mehr kannst: Kinderarzt, Erziehungsberatung oder Elternnotruf.'},
 {id:'schlaf', e:'🌙', l:'Schlaf',
  behind:'Kinder brauchen viel Schlaf und einen gleichen Ablauf am Abend. Bildschirme, Aufregung und spätes Licht machen das Einschlafen schwer.',
  normal:{'1-3':'1–2 Jahre: 11–14 Stunden pro Tag inklusive Mittagsschlaf. Nachts aufwachen kommt noch oft vor.','3-6':'3–5 Jahre: 10–13 Stunden. Ängste in der Nacht sind in diesem Alter häufig.','6-12':'6–12 Jahre: 9–12 Stunden. Ein fester Ablauf hilft mehr als jede Strafe.','12-16':'Jugendliche: 8–10 Stunden. Die innere Uhr verschiebt sich nach hinten, das ist biologisch, nicht faul.'},
  try:'Jeden Abend der gleiche Ablauf mit 4–6 Schritten (Bad, Zähne, Geschichte, Kuscheln, Licht). Bildschirme 1 Stunde vorher weg.',
  body:'Im Bett: Füsse spüren, Bär schläft ein, drei lange Ausatmer.',
  when:'Lautes Schnarchen mit Atempausen, starke Müdigkeit am Tag oder Ängste über Wochen: Kinderarzt.',
  link:'schlaf'},
 {id:'baby', e:'👶', l:'Baby weint viel',
  behind:'Viel Weinen ist in den ersten Monaten häufig. Es hat oft den Höhepunkt mit 6–8 Wochen und wird bis 3–4 Monate meist besser.',
  normal:{'1-3':'Bei Babys unter 4 Monaten ist viel Weinen am späten Nachmittag und Abend häufig.','3-6':'Dieses Thema gilt vor allem für Babys.','6-12':'Dieses Thema gilt vor allem für Babys.','12-16':'Dieses Thema gilt vor allem für Babys.'},

/* Rechen-Zimmer: passt sich an (Tempo + Tagesform), mit erklärender Rückmeldung */
let rechnen = {n:0, ok:0, lvl:null, cur:null, streak:0};
function rLevelStart(){ return {'1-3':0,'3-6':1,'6-12':2,'12-16':4}[state.age] - (state.mood==='schnecke'?1:0); }
function newRechnen(){
  if(rechnen.lvl===null) rechnen.lvl = Math.max(0, rLevelStart());
  const L = rechnen.lvl; let a,b,op;
  const r = (m,n)=>m+Math.floor(Math.random()*(n-m+1));
  if(L<=0){ a=r(1,3); b=r(1,2); op='+'; }
  else if(L===1){ a=r(1,5); b=r(1,4); op='+'; }
  else if(L===2){ op=Math.random()<.5?'+':'−'; a=r(3,10); b=r(1,a); if(op==='+') b=r(1,10-a>0?10-a:1); }
  else if(L===3){ op=Math.random()<.5?'+':'−'; a=r(8,20); b=r(2,9); if(op==='−'&&b>a) [a,b]=[b,a]; }
  else if(L===4){ op='×'; a=r(2,6); b=r(2,10); }
  else { op=Math.random()<.5?'×':'+'; if(op==='×'){a=r(3,12); b=r(3,12);} else {a=r(20,90); b=r(11,49);} }
  const res = op==='+'?a+b : op==='−'?a-b : a*b;
  const opts = new Set([res]); while(opts.size<4){ const d = res + (Math.floor(Math.random()*7)-3); if(d>=0 && d!==res) opts.add(d); }
  rechnen.cur = {a,b,op,res,opts:[...opts].sort(()=>Math.random()-.5)};
}
function dots(a,b,op){
  if(op==='×' || a+b>20) return '';
  if(op==='+') return `<div class="dots">${'<i></i>'.repeat(a)}${'<i class="b"></i>'.repeat(b)}</div>`;
  return `<div class="dots">${'<i></i>'.repeat(a-b)}${'<i class="b" style="opacity:.25"></i>'.repeat(b)}</div>`;
}
function vRechnen(){
  if(!rechnen.cur) newRechnen();
  const c = rechnen.cur;
  const spoken = c.op==='+'?'plus':c.op==='−'?'minus':'mal';
  setTimeout(()=>say('Wie viel ist '+c.a+' '+spoken+' '+c.b+'?'),300);

}

/* ---------- Bewegungspause und SOS ---------- */
function movePause(next){
  const b = BODY[Math.floor(Math.random()*BODY.length)];
  const el = document.createElement('div'); el.className='pause';
  el.innerHTML = `<div class="card gold" style="text-align:center">${fig('cheer',110)}<p class="muted">Bewegungspause, mach mit!</p><div style="font-size:3.4rem">${b.e}</div><h2>${esc(b.l)}</h2><p>${esc(b.d)}</p>
   <div class="timer" id="mp-t">20</div><button class="btn block" id="mp-ok">Weiter</button></div>`;
  document.body.appendChild(el); say('Bewegungspause! '+b.d);
  let left = 20; const t = setInterval(()=>{ left--; const tt=el.querySelector('#mp-t'); if(tt) tt.textContent=left; if(left<=0){ clearInterval(t); } },1000);
  el.querySelector('#mp-ok').onclick = ()=>{ clearInterval(t); el.remove(); stopSay(); next && next(); };
}
function sos(){
  const el = document.createElement('div'); el.className='pause';
  el.innerHTML = `<div class="card gold" style="text-align:center">${fig('calm',90)}
   <p style="font-weight:700">Du machst das gut. Es ist zu viel gerade. Das ist menschlich.</p>
   <p><b>Ist ein Baby da? Leg es sicher auf den Rücken ins Bettchen und geh kurz raus. Nie schütteln.</b></p>
   <div class="breath" id="sos-b"></div><p id="sos-l" style="font-weight:700">Einatmen …</p><div class="timer" id="sos-t">60</div>
   <a class="btn red block" href="tel:0848354555">📞 Elternnotruf 0848 35 45 55</a>
   <a class="btn alt block" href="tel:144">📞 Notfall 144</a>
   <button class="btn alt block" id="sos-x">Schliessen</button></div>`;
  document.body.appendChild(el);
  say('Du machst das gut. Leg das Baby sicher hin. Atme mit mir. Ein. Und lang aus.');
  let left = 60, ph = 1; setTimeout(()=>el.querySelector('#sos-b').classList.add('in'),100);
  const t = setInterval(()=>{ left--; const tt=el.querySelector('#sos-t'); if(!tt){clearInterval(t);return;} tt.textContent=left;
    if(left%4===0){ ph=1-ph; el.querySelector('#sos-b').classList.toggle('in',ph===1); el.querySelector('#sos-l').textContent = ph?'Einatmen …':'Lang ausatmen …'; }
    if(left<=0){ clearInterval(t); el.querySelector('#sos-l').textContent='Gut. Wenn du magst, ruf jemanden an.'; } },1000);
  el.querySelector('#sos-x').onclick = ()=>{ clearInterval(t); el.remove(); stopSay(); };
}

/* ---------- Freude: Sterne, Klang ---------- */
let actx = null;
function pling(){
  if(!state.voice) return;
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    [660, 880, 1175].forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type='sine'; o.frequency.value=f;
      const t0=actx.currentTime+i*.08; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(.18,t0+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+.35);
      o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+.4); });
  }catch(e){}
}
function jubel(el){
  let x = innerWidth/2, y = innerHeight/2;
  if(el && el.getBoundingClientRect){ const r = el.getBoundingClientRect(); x = r.left+r.width/2; y = r.top+r.height/2; }
  const em = ['⭐','✨','🍌','🌟','💛'];
  for(let i=0;i<16;i++){ const s=document.createElement('span'); s.className='burst'; s.textContent=em[i%em.length];
    const a=Math.random()*Math.PI*2, d=60+Math.random()*90;
    s.style.setProperty('--x0',(x-12)+'px'); s.style.setProperty('--y0',(y-12)+'px');
    s.style.setProperty('--x1',(x-12+Math.cos(a)*d)+'px'); s.style.setProperty('--y1',(y-12+Math.sin(a)*d-30)+'px');
    s.style.setProperty('--r',(Math.random()*360-180)+'deg');
    document.body.appendChild(s); setTimeout(()=>s.remove(),1100); }
  pling();
}

/* ---------- Start-Szene ---------- */
function intro(){
  let seen = false; try{ seen = sessionStorage.getItem('mamaaffe.intro')==='1'; sessionStorage.setItem('mamaaffe.intro','1'); }catch(e){}
  if(seen || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const el = document.createElement('div'); el.id='intro';
  const name = 'Mama Affe'.split('').map((c,i)=>`<span style="animation-delay:${1.1+i*.07}s">${c===' '?'&nbsp;':c}</span>`).join('');
  el.innerHTML = `<div class="vine"><div class="rope"></div><span class="leaf" style="top:7vh;left:58px">🌿</span><span class="leaf" style="top:17vh;left:88px;transform:scaleX(-1)">🌿</span>${fig('wave')}</div>
   <div class="name">${name}</div><div class="tap">Tippen zum Starten</div>`;
  document.body.appendChild(el);
  const done = ()=>{ if(el.classList.contains('out')) return; el.classList.add('out'); setTimeout(()=>el.remove(),650); };
  el.addEventListener('click', done); setTimeout(done, 3600);
}

function spanAdd(room, ok){
  const sp = store.get('span', {}); const v = sp[room] || {best:0, usual:0, hist:[]};
  v.hist = (v.hist||[]).concat(ok?1:0).slice(-30);
  const recent = v.hist.slice(-10); const rate = recent.reduce((a,b)=>a+b,0)/recent.length;
  v.best = Math.max(v.best, Math.round(rate*5));
  const all = v.hist.reduce((a,b)=>a+b,0)/v.hist.length; v.usual = Math.round(all*5*0.9);
  sp[room] = v; store.set('span', sp);
  if(ok) jubel(document.querySelector('.answers .ok') || document.querySelector('.timer'));
}

/* ---------- Render ---------- */
function render(){
  let h = '';
  if(!mode) h = vHome();
  else {
    const [v, arg] = view.split(':');
    const map = {heute: arg? ()=>vSituation(arg) : vHeute, alter:vAlter, momente:vMomente, notiz:vNotiz, schlaf:vSchlaf, hilfe:vHilfe,
      schule:vSchule, ankommen:vAnkommen, lesen:vLesen, rechnen:vRechnen, staunen:vStaunen, koerper:vKoerper, uebung:()=>vUebung(arg),
      tier:vTier, abend:vAbend, plan:vPlan, fokus:vFokus, erklaer:vErklaer, spiegel:vSpiegel};
    h = (map[v] || (mode==='eltern'?vHeute:vSchule))();
  }
  app.innerHTML = h; tabs();
}
function setMode(m, to){
  mode = m; store.set('mode', m);
  view = to || (m==='eltern' ? 'heute' : 'schule');
  render(); window.scrollTo(0,0);
}

/* ---------- Ereignisse ---------- */
document.addEventListener('click', e=>{
  const t = e.target.closest('button, .check, .tile'); if(!t) return;
  const d = t.dataset;
  if(d.age){ state.age = d.age; store.set('age', d.age); rechnen.lvl=null; rechnen.cur=null; lese.cur=null; render(); return; }
  if(d.mode){ setMode(d.mode, d.to); return; }
  if(d.go){ go(d.go); return; }
  if(d.sos){ sos(); return; }
  if(d.mood){ const nm = $('#kname'); if(nm){ state.kidName = nm.value.trim().slice(0,30); store.set('kidName', state.kidName); } state.mood = d.mood; render(); say(d.mood==='schnecke'?'Danke, dass du es sagst. Wir machen es heute kurz.':'Super! Zuerst ankommen, dann wählst du ein Zimmer.'); return; }
  if(d.animal){ store.set('animal', {d:new Date().toDateString(), n:d.animal}); render(); const a=ANIMALS.find(x=>x.n===d.animal); say(a.n+'. '+a.m); return; }
  if(d.rit!==undefined){ const today=new Date().toDateString(); let r=store.get('ritual',{d:today,s:[]}); if(r.d!==today) r={d:today,s:[]}; const i=+d.rit; r.s = r.s.includes(i)? r.s.filter(x=>x!==i) : r.s.concat(i); store.set('ritual', r); render(); if(r.s.length===RITUAL.length) say('Alles geschafft! Gute Nacht.'); return; }
  if(d.chk!==undefined){ t.classList.toggle('done'); t.querySelector('.e').textContent = t.classList.contains('done')?'✅':'⬜'; return; }
  if(d.focus){ clearTimers(); let s = +d.focus*60; const tt=$('#fk-t'), ll=$('#fk-l'); ll.textContent='Eine Aufgabe. Los geht es.'; say('Los geht es. Eine Aufgabe, volle Aufmerksamkeit.');
    const f=()=>{ tt.textContent = String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
    f(); const iv=setInterval(()=>{ s--; if(!$('#fk-t')){clearInterval(iv);return;} f(); if(s<=0){ clearInterval(iv); ll.textContent='Geschafft! Jetzt bewegen.'; movePause(); } },1000); timers.push(iv); return; }
  if(d.lese){ const c = lese.cur; const ok = d.lese===c.right; t.classList.add(ok?'ok':'no'); spanAdd('lesen', ok);
    if(!ok){ say('Fast. Hör genau: '+c.item.w+'. Es beginnt mit '+c.right+'.'); return; }
    lese.n++; lese.ok++; say('Ja! '+c.item.w+' beginnt mit '+c.right+'.');
    setTimeout(()=>{ lese.cur=null; if(lese.n>=blockLen()){ lese.n=0; toast('⭐ Stern im Lese-Zimmer'); movePause(()=>go('schule')); } else render(); },1100); return; }
  if(d.rech){ const c = rechnen.cur; const ok = +d.rech===c.res; t.classList.add(ok?'ok':'no'); spanAdd('rechnen', ok);
    if(!ok){ rechnen.streak=0; if(rechnen.lvl>0 && !rechnen.missed) rechnen.missed=true; else if(rechnen.lvl>0){ rechnen.lvl--; rechnen.missed=false; } say('Schau mal: '+explainRechnen(c)); toast(explainRechnen(c)); return; }
    rechnen.n++; rechnen.streak++; rechnen.missed=false; say('Richtig! '+explainRechnen(c));
    if(rechnen.streak>=3 && rechnen.lvl<5){ rechnen.lvl++; rechnen.streak=0; toast('Nächste Stufe 🚀'); }
    setTimeout(()=>{ rechnen.cur=null; if(rechnen.n>=blockLen()){ rechnen.n=0; toast('⭐ Stern im Rechen-Zimmer'); movePause(()=>go('schule')); } else render(); },1300); return; }
  switch(d.act){
    case 'voice': state.voice=!state.voice; store.set('voice', state.voice); if(!state.voice) stopSay(); render(); break;
    case 'home': mode=null; store.set('mode', null); view='home'; stopSay(); clearTimers(); render(); break;
    case 'resetMood': state.mood=null; render(); break;
    case 'sayWord': say(lese.cur.item.w); break;
    case 'sayAgain': say(d.text); break;
    case 'rhyme': say(RHYME); break;
    case 'bodyRun': bodyRun = {i:0, list:['faecher','yoga','klavier','griff','wurzeln']}; go('uebung:faecher'); break;
    case 'bodyStop': bodyRun=null; go('koerper'); break;
    case 'ritReset': store.set('ritual', {d:new Date().toDateString(), s:[]}); render(); break;
    case 'addMoment': { const v=$('#mtext').value.trim(); if(!v) return; const l=store.get('moments',[]); l.push({d:new Date().toLocaleDateString('de-CH'), t:v}); store.set('moments', l); toast('✨ Gespeichert'); render(); break; }
    case 'saveIdea': { const v=$('#stext').value.trim(); if(!v) return; const l=store.get('moments',[]); l.push({d:new Date().toLocaleDateString('de-CH'), t:'Idee: '+v}); store.set('moments', l); toast('✨ Gespeichert'); say('Was für eine Idee! Wie bist du darauf gekommen?'); break; }
    case 'addNote': { const v=$('#ntext').value.trim(); if(!v) return; const l=store.get('notes',[]); l.push({d:new Date().toLocaleString('de-CH'), t:v}); store.set('notes', l); toast('📝 Gespeichert'); render(); break; }
    case 'copyNotes': { const l=store.get('notes',[]); const txt=l.map(n=>n.d+': '+n.t).join('\n'); try{ navigator.clipboard.writeText(txt).then(()=>toast('📋 Kopiert')); }catch(e){ toast('Kopieren geht hier nicht'); } break; }
    case 'savePlan': store.set('plan', {date:$('#pdate').value, topics:$('#ptop').value}); render(); break;
  }
});
/* Kindermodus: Haus-Knopf lange drücken (Elternsperre light) */
let holdT = null;
function holdStart(e){ const b = e.target.closest('[data-hold]'); if(!b) return; e.preventDefault(); const bar=b.querySelector('.bar'); bar.style.transition='width 1.5s linear'; bar.style.width='100%';
  holdT = setTimeout(()=>{ mode=null; store.set('mode', null); view='home'; state.mood=null; stopSay(); clearTimers(); render(); },1500); }
function holdEnd(e){ clearTimeout(holdT); const bar=document.querySelector('[data-hold] .bar'); if(bar){ bar.style.transition='none'; bar.style.width='0'; } }
document.addEventListener('pointerdown', holdStart); document.addEventListener('pointerup', holdEnd); document.addEventListener('pointerleave', holdEnd, true); document.addEventListener('pointercancel', holdEnd);
document.addEventListener('click', e=>{ if(e.target.closest('[data-hold]')) toast('Für Eltern: Haus lange drücken'); });

buildSky(); intro();
render();
</script>

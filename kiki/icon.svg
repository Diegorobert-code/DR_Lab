      </g>
      <ellipse cx="140" cy="182" rx="15" ry="12" fill="#8992a8"/>
      <!-- Ohren -->
      <g class="earL"><circle cx="42" cy="62" r="38" fill="url(#fur)"/><circle cx="44" cy="65" r="23" fill="url(#earIn)"/>
        <path d="M14 48c4-6 8-4 10-10M10 66c5-2 6-6 12-6" stroke="#e7ebf3" stroke-width="3" stroke-linecap="round" fill="none" opacity=".7"/></g>
      <g class="earR"><circle cx="158" cy="62" r="38" fill="url(#fur)"/><circle cx="156" cy="65" r="23" fill="url(#earIn)"/>
        <path d="M186 48c-4-6-8-4-10-10M190 66c-5-2-6-6-12-6" stroke="#e7ebf3" stroke-width="3" stroke-linecap="round" fill="none" opacity=".7"/></g>
      <!-- Kopf -->

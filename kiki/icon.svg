<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><radialGradient id="bg" cx="50%" cy="20%" r="85%"><stop offset="0" stop-color="#2b4596"/><stop offset="1" stop-color="#0f1b3d"/></radialGradient></defs><rect width="512" height="512" fill="url(#bg)"/><g transform="translate(46 50) scale(2.1)">
  <defs>
    <radialGradient id="fur" cx="45%" cy="35%" r="70%"><stop offset="0" stop-color="#c3cad8"/><stop offset=".6" stop-color="#9aa3b8"/><stop offset="1" stop-color="#737d95"/></radialGradient>
    <radialGradient id="earIn" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#ffd7dc"/><stop offset="1" stop-color="#eaa4b0"/></radialGradient>
    <radialGradient id="noseG" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="#5a5f74"/><stop offset=".55" stop-color="#2c3044"/><stop offset="1" stop-color="#1a1d2b"/></radialGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#d9a22e"/></linearGradient>
    <radialGradient id="bellyG" cx="50%" cy="30%" r="70%"><stop offset="0" stop-color="#eef1f7"/><stop offset="1" stop-color="#c7cede"/></radialGradient>
  </defs>
  <g class="body">
    <g class="idle">
      <!-- Körper -->
      <ellipse cx="100" cy="188" rx="58" ry="30" fill="url(#fur)"/>
      <ellipse cx="100" cy="192" rx="34" ry="20" fill="url(#bellyG)"/>

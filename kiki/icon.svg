      <ellipse cx="100" cy="134" rx="40" ry="26" fill="#d4d9e5" opacity=".75"/>
      <!-- Goldene Haarspange (Stern) -->
      <path d="M128 52l3.2 6.6 7.2 1-5.2 5 1.3 7.2-6.5-3.4-6.5 3.4 1.3-7.2-5.2-5 7.2-1z" fill="url(#goldG)" stroke="#b9861f" stroke-width="1"/>
      <!-- Wangen -->
      <ellipse cx="58" cy="124" rx="12" ry="7" fill="#ff9fb0" opacity=".45"/>
      <ellipse cx="142" cy="124" rx="12" ry="7" fill="#ff9fb0" opacity=".45"/>
      <!-- Augen offen -->
      <g class="eOpen">
        <g class="blink"><ellipse cx="72" cy="98" rx="14" ry="16" fill="#fff"/><circle cx="74" cy="101" r="10" fill="#1b2030"/><circle cx="77" cy="96" r="4" fill="#fff"/><circle cx="70" cy="105" r="1.8" fill="#fff" opacity=".8"/></g>
        <g class="blink"><ellipse cx="128" cy="98" rx="14" ry="16" fill="#fff"/><circle cx="126" cy="101" r="10" fill="#1b2030"/><circle cx="129" cy="96" r="4" fill="#fff"/><circle cx="122" cy="105" r="1.8" fill="#fff" opacity=".8"/></g>
      </g>
      <!-- Augen fröhlich -->
      
      <!-- Nase -->
      <path d="M100 100c13 0 19 9 19 21 0 11-8 17-19 17s-19-6-19-17c0-12 6-21 19-21z" fill="url(#noseG)"/>
      <ellipse cx="94" cy="109" rx="5" ry="3.5" fill="#fff" opacity=".35"/>

# Android-Apps (Google Play) auf einem Gratis-Linux-Rechner von GitHub bauen.
# Ohne Schlüssel: Test-APK zum Ausprobieren + unsigniertes Bundle (zeigt, ob alles baut).
# Mit Upload-Schlüssel in den Secrets: signiertes .aab, das Diego in der Play Console hochlädt.
# Hochgeladen wird nie automatisch.
name: Android-Apps bauen

on:
  push:
    branches: [main]
    paths: ['appstore/**', 'mondschein/**', 'humanspark/**', 'tradeping/**', 'jackie/**', 'schlaf/**', 'kiki/**', 'mama-affe/**', 'fompa/**', 'appid/**', 'otti/**', 'transkript/**', 'granny/**', 'carmen/**', 'waefwaef/**', 'coinmaker/**', 'hasi/**', 'fia-kosmos/**', 'nova/**', 'apps/sprechen/**', '.github/workflows/android-build.yml']
  pull_request:
    paths: ['appstore/**', 'mondschein/**', 'humanspark/**', 'tradeping/**', 'jackie/**', 'schlaf/**', 'kiki/**', 'mama-affe/**', 'fompa/**', 'appid/**', 'otti/**', 'transkript/**', 'granny/**', 'carmen/**', 'waefwaef/**', 'coinmaker/**', 'hasi/**', 'fia-kosmos/**', 'nova/**', 'apps/sprechen/**', '.github/workflows/android-build.yml']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bauen:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [mondschein, humanspark, tradeping, jackie, fiasnest, kiki, mamaaffe, fompa, foodandflow, otti, transkript, granny, carmen, waefwaef, coinmaker, hasi, fiakosmos]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Web-Teil bauen und Android synchronisieren
        working-directory: appstore/${{ matrix.app }}
        run: |
          npm ci --no-fund --no-audit
          # web-bauen holt Apps, die noch nicht auf main sind, aus ihrem Branch (apps.json «quelleBranch»)
          node ../web-bauen.mjs ${{ matrix.app }}
          npx cap sync android

      - name: Upload-Schlüssel bereitlegen
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PLAY_KEYSTORE_BASE64" ]; then
            echo "$PLAY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "PLAY_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::Kein Upload-Schlüssel: Bundle bleibt unsigniert (nur Test)"
          fi

      - name: Bauen (Test-APK + Play-Bundle)
        working-directory: appstore/${{ matrix.app }}/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-android-${{ github.run_number }}
          path: |
            appstore/${{ matrix.app }}/android/app/build/outputs/apk/debug/*.apk
            appstore/${{ matrix.app }}/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

# Prüft das Zuhören mit Whisper in Mondschein mit dem echten Sprachmodell.
name: Mondschein Whisper testen

on:
  pull_request:
    paths: ['mondschein/index.html', 'tools/tests/whisper-test.mjs', '.github/workflows/mondschein-whisper.yml']
  workflow_dispatch:

jobs:
  whisper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Werkzeuge
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q espeak-ng
          npm install --no-save --prefix tools/tests playwright@1.56.1
          npx --prefix tools/tests playwright install --with-deps chromium
      - name: Satz sprechen und erkennen
        run: |
          espeak-ng -v de -s 140 -w /tmp/satz-roh.wav "Ich habe einen kleinen Hund."
          ffmpeg -loglevel error -y -i /tmp/satz-roh.wav -ar 16000 -ac 1 -c:a pcm_s16le /tmp/satz.wav
          node tools/tests/whisper-test.mjs /tmp/satz.wav

<script>
// Falsche oder alte Adressen: Sense Engine liegt (noch) im Stimmraum, alles andere geht zur DR-Lab-Startseite.
(function () {
  var p = location.pathname.toLowerCase();
  var ziel = /sense|nova|engine/.test(p) ? "/Stimmraum/sense/" : "/DR_Lab/";
  location.replace(ziel + location.search + location.hash);
})();
</script>

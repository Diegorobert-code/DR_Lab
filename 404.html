<title>Weiterleitung</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07091A;color:#E9ECF5;font:500 16px/1.5 system-ui,sans-serif}a{color:#FFB547}</style>
<script>
// Falsche oder alte Adressen (drlabsolutions.com oder github.io): Sense Engine liegt (noch) im Stimmraum, alles andere geht zur DR-Lab-Startseite.
(function () {
  var p = location.pathname.toLowerCase();
  var github = /github\.io$/.test(location.hostname);
  var start = github ? "/DR_Lab/" : "/";
  var ziel = /sense|nova|engine/.test(p) ? "https://diegorobert-code.github.io/Stimmraum/sense/" : start;
  location.replace(ziel + location.search + location.hash);
})();
</script>
</head>
<body><p>Einen Moment … <a href="https://drlabsolutions.com/">Zu DR Lab</a></p></body>
